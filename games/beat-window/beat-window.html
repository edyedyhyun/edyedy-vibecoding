<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>박자 사이 · Beat Window</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101823;color:#edf3ed;font:16px system-ui,sans-serif}main{max-width:930px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;margin:0 0 5px}p{color:#a9bbbf;margin:5px 0 18px}.tag{color:#9cdfb8;font:13px monospace;letter-spacing:2px}.stats{display:flex;gap:10px;margin:16px 0}.stats div{flex:1;background:#1b2935;border:1px solid #344652;padding:12px;border-radius:12px;font-size:13px;color:#b4c6c9}.stats strong{display:block;font-size:25px;color:#fff}section{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}.board{width:100%;max-width:430px;justify-self:center}canvas{display:block;width:100%;height:auto;border-radius:20px;border:1px solid #405861;background:#14232f}.pads{display:flex;gap:12px;margin-top:12px}button{font:inherit;border:1px solid #54726e;border-radius:12px;padding:12px 16px;background:#29413d;color:#f5ffed;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff;outline-offset:3px}.pads button{width:50%;font-size:22px;font-weight:700}.pads button:last-child{background:#453544;border-color:#937c92}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#feedback{min-height:55px;color:#c5efcf;font-size:19px;font-weight:600}label{display:block;font-size:14px;margin:15px 0}input{max-width:100%;accent-color:#98dda8}small{display:block;color:#a9bbbf;line-height:1.8}#result{background:#213d34;padding:15px;border-radius:12px;margin:14px 0}#result:empty{display:none}@media(max-width:650px){main{padding:14px}section{grid-template-columns:1fr;gap:12px}.board{max-width:340px}h1{font-size:26px}.stats div{padding:8px}.stats strong{font-size:20px}aside{order:-1}.details{display:none}.controls{margin:8px 0}#feedback{min-height:28px;font-size:16px}header .tag{display:none}p{margin-bottom:8px}}
</style><main><header><div><h1>박자 사이</h1><p>두 손으로 두드리는 짧은 리듬 한 판</p></div><span class="tag">BEAT WINDOW / 100 BPM</span></header>
<div class="stats"><div>점수<strong id="score">0</strong></div><div>연속<strong id="combo">0</strong></div><div>맞힘 / 32<strong id="hits">0</strong></div><div>놓침<strong id="misses">0</strong></div></div>
<section><div class="board"><canvas width="430" height="440" aria-label="두 줄로 노트가 내려오는 리듬 게임"></canvas><div class="pads"><button id="left" aria-label="왼쪽 노트 D">D · 왼쪽</button><button id="right" aria-label="오른쪽 노트 K">K · 오른쪽</button></div></div><aside><div id="feedback" aria-live="polite">시작을 누르면 2초 뒤 첫 노트!</div><div class="controls"><button id="start">시작</button><button id="pause" disabled>일시정지</button><button id="reset">처음으로</button></div><label><input id="sound" type="checkbox" checked> 비트 소리</label><div id="result"></div><div class="details"><p>노트의 가운데가 밝은 선에 닿을 때!</p><small>D / K 또는 화면 버튼으로 입력합니다.<br>정확: ±55ms · 좋아요: ±130ms<br>노트 32개, 약 22초. 목숨 제한은 없어요.</small></div><label>입력 보정 <output id="offsetLabel">0ms</output><br><input id="offset" type="range" min="-150" max="150" step="10" value="0"></label><small>계속 늦게 잡히면 + 방향으로 조절하세요. 다음 판에 적용됩니다. 장치 지연을 자동 측정한 값은 아닙니다.</small></aside></section></main>
<script>
(function(root){'use strict';
const BPM=100,BEAT=60/BPM;
const chart=Array.from({length:32},(_,i)=>({id:i,time:2+i*BEAT,lane:[0,1,0,0,1,0,1,1][i%8]}));
class Game{
 constructor(window=.13){this.window=window;this.reset()}
 reset(){this.notes=chart.map(n=>({...n,status:'pending'}));this.time=0;this.phase='ready';this.combo=0;this.best=0;this.score=0;this.hits=0;this.misses=0;this.inputs=0;this.last='D / K 또는 아래 버튼을 눌러요';this.errors=[]}
 start(){this.reset();this.phase='playing'}
 advance(t){if(this.phase!=='playing')return;this.time=Math.max(this.time,t);for(const n of this.notes){if(n.status==='pending'&&this.time>n.time+this.window){n.status='miss';this.misses++;this.combo=0;this.last='놓침 · 다음 박자를 기다려요'}}if(this.time>chart.at(-1).time+.8){this.phase='finished';this.last='한 곡 끝! 다시 눌러 볼까요?'}}
 hit(lane,t=this.time){if(this.phase!=='playing')return null;this.advance(t);if(this.phase!=='playing')return null;this.inputs++;const candidates=this.notes.filter(n=>n.lane===lane&&n.status==='pending'&&Math.abs(t-n.time)<=this.window+1e-9);candidates.sort((a,b)=>Math.abs(t-a.time)-Math.abs(t-b.time));const n=candidates[0];if(!n){this.last='빈 박자 · 노트가 선에 올 때 눌러요';return null}const error=t-n.time;n.status=Math.abs(error)<=.055+1e-9?'perfect':'good';this.errors.push(error);this.hits++;this.combo++;this.best=Math.max(this.best,this.combo);this.score+=n.status==='perfect'?100:60;this.last=(n.status==='perfect'?'정확!':'좋아요')+' · '+Math.round(error*1000)+'ms';return {status:n.status,error,id:n.id}}
}
const api={Game,chart,BPM,BEAT};if(typeof module==='object')module.exports=api;else root.BeatWindow=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
'use strict';
const {Game,chart,BEAT}=BeatWindow,g=new Game(),$=id=>document.getElementById(id),c=document.querySelector('canvas'),ctx=c.getContext('2d');
let audio=null,origin=0,frozen=0,nextBeat=0,runOffset=0,flash=[0,0],pressed=new Set();
function tone(at,index){if(!$('sound').checked)return;const o=audio.createOscillator(),v=audio.createGain();o.type=index%4===0?'sine':'triangle';o.frequency.setValueAtTime(index%4===0?170:660,at);v.gain.setValueAtTime(.0001,at);v.gain.exponentialRampToValueAtTime(.075,at+.005);v.gain.exponentialRampToValueAtTime(.0001,at+.07);o.connect(v);v.connect(audio.destination);o.start(at);o.stop(at+.08)}
async function start(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();if(audio.state!=='running')throw Error('audio paused');g.start();runOffset=Number($('offset').value)/1000;origin=audio.currentTime+.1;nextBeat=0;frozen=0;$('offset').disabled=true;$('start').disabled=true;$('pause').disabled=false;$('pause').textContent='일시정지';$('result').textContent='';}catch(e){$('feedback').textContent='소리를 시작하지 못했어요. 시작 버튼을 다시 눌러 주세요.'}}
function time(){return Math.max(0,audio.currentTime-origin)}
function hit(lane){if(g.phase!=='playing')return;g.hit(lane,time()-runOffset);flash[lane]=performance.now()+140;update()}
async function pause(){if(g.phase==='playing'){frozen=time();g.phase='paused';await audio.suspend();$('pause').textContent='계속';$('feedback').textContent='잠시 쉬는 중';}else if(g.phase==='paused'){await audio.resume();origin=audio.currentTime-frozen;g.phase='playing';$('pause').textContent='일시정지'}}
function reset(){g.reset();if(audio)audio.suspend();pressed.clear();$('start').disabled=false;$('pause').disabled=true;$('pause').textContent='일시정지';$('offset').disabled=false;$('result').textContent='';update();$('feedback').textContent='시작을 누르면 2초 뒤 첫 노트!'}
function update(){for(const n of ['score','combo','hits','misses'])$(n).textContent=g[n];if(g.phase==='playing')$('feedback').textContent=g.last;if(g.phase==='finished'){$('start').disabled=false;$('pause').disabled=true;$('offset').disabled=false;$('feedback').textContent=g.last;const mean=g.errors.length?Math.round(g.errors.reduce((a,b)=>a+b,0)/g.errors.length*1000):null;$('result').textContent=`맞힘 ${g.hits}/32 · 최고 연속 ${g.best}`+(mean===null?'':` · 평균 오차 ${mean}ms`);}}
function draw(){ctx.clearRect(0,0,430,440);ctx.fillStyle='#14232f';ctx.fillRect(0,0,430,440);for(let lane=0;lane<2;lane++){ctx.fillStyle=performance.now()<flash[lane]?(lane?'#70506b':'#3b725a'):'#1d303e';ctx.fillRect(30+lane*195,12,175,415)}ctx.strokeStyle='#496171';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(215,0);ctx.lineTo(215,440);ctx.stroke();for(const n of g.notes){if(n.status!=='pending')continue;const y=360-(n.time-(g.phase==='playing'?time():g.phase==='paused'?frozen:g.time))*170;if(y<-20||y>430)continue;ctx.fillStyle=n.lane?'#edacd7':'#ade7b7';ctx.beginPath();ctx.roundRect(55+n.lane*195,y-9,125,18,8);ctx.fill();}ctx.shadowBlur=13;ctx.shadowColor='#ecf9c9';ctx.strokeStyle='#ecf9c9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(25,360);ctx.lineTo(405,360);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#c3d3d9';ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.fillText('D',115,400);ctx.fillText('K',310,400);if(g.phase==='ready'||g.phase==='paused'){ctx.fillStyle='#10202cd9';ctx.fillRect(40,140,350,115);ctx.fillStyle='#edf6e8';ctx.font='600 23px system-ui';ctx.fillText(g.phase==='paused'?'잠시 쉬는 중':'박자 사이',215,180);ctx.font='15px system-ui';ctx.fillText(g.phase==='paused'?'계속 버튼으로 이어가요':'밝은 선에서 D / K',215,220)}if(g.phase==='finished'){ctx.fillStyle='#132d26ec';ctx.fillRect(40,140,350,110);ctx.fillStyle='#e8f8d9';ctx.font='600 24px system-ui';ctx.fillText('한 곡 끝!',215,186);ctx.font='16px system-ui';ctx.fillText(`${g.score}점 · ${g.hits}개 맞힘`,215,224)}}
function frame(){if(g.phase==='playing'){const t=time();g.advance(Math.max(0,t-runOffset));while(nextBeat*BEAT+2<=t+.08&&nextBeat<32){const at=origin+2+nextBeat*BEAT;if(at>audio.currentTime+.002)tone(at,nextBeat);nextBeat++;}update()}draw();requestAnimationFrame(frame)}
$('start').onclick=start;$('pause').onclick=pause;$('reset').onclick=reset;$('offset').oninput=()=>$('offsetLabel').textContent=$('offset').value+'ms';
for(const [id,lane]of [['left',0],['right',1]]){$(id).onpointerdown=e=>{e.preventDefault();hit(lane)};$(id).onclick=e=>{if(e.detail===0)hit(lane)}}
document.addEventListener('keydown',e=>{const lane={KeyD:0,KeyK:1}[e.code];if(lane===undefined||e.target.matches('input'))return;e.preventDefault();if(e.repeat||pressed.has(e.code))return;pressed.add(e.code);hit(lane)});document.addEventListener('keyup',e=>pressed.delete(e.code));window.addEventListener('blur',()=>{pressed.clear();if(g.phase==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.phase==='playing')pause()});frame();

</script></html>
