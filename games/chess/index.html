<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다음 한 수 — 체스 · 로컬 2인용</title>
<style>
  :root {
    --cream: #f6f1e4;
    --paper: #efe7d6;
    --slate: #45566b;
    --slate-dark: #1f2733;
    --ivory: #faf7ef;
    --charcoal: #262321;
    --teal: #14807a;
    --coral: #e0603f;
    --light-square: #ece2cd;
    --dark-square: #52667e;
    --line: rgba(31, 39, 51, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 12px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.7rem;
    letter-spacing: 0.02em;
    color: var(--slate-dark);
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 0.95rem;
    color: var(--teal);
    font-weight: 600;
  }

  main {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    justify-content: center;
    width: 100%;
    max-width: 800px;
  }

  .board-wrap {
    display: grid;
    grid-template-columns: 20px 480px;
    grid-template-rows: 20px 480px;
    max-width: 100%;
  }

  .corner { }

  .col-labels, .row-labels {
    display: flex;
    color: var(--slate-dark);
    font-size: 0.75rem;
    font-weight: 700;
  }

  .col-labels {
    grid-column: 2;
    grid-row: 1;
    justify-content: space-around;
    align-items: center;
  }

  .row-labels {
    grid-column: 1;
    grid-row: 2;
    flex-direction: column;
    justify-content: space-around;
    align-items: center;
  }

  #board {
    grid-column: 2;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 480px;
    height: 480px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--slate-dark);
    border: 4px solid var(--slate-dark);
    border-radius: 6px;
    overflow: hidden;
  }

  .cell {
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
    outline-offset: -3px;
    font-size: 2.4rem;
    line-height: 1;
  }

  .cell.light { background: var(--light-square); }
  .cell.dark { background: var(--dark-square); }

  .cell:focus-visible {
    outline: 3px solid var(--coral);
  }

  .cell.selected {
    box-shadow: inset 0 0 0 3px var(--teal);
  }

  .cell.last-move {
    box-shadow: inset 0 0 0 3px var(--coral);
  }

  .cell.selected.last-move {
    box-shadow: inset 0 0 0 3px var(--teal), inset 0 0 0 6px var(--coral);
  }

  .cell.check-square {
    background-image: radial-gradient(circle, rgba(224, 96, 63, 0.55), transparent 70%);
  }

  .piece-glyph {
    user-select: none;
    font-family: "Arial Unicode MS", "DejaVu Sans", serif;
    font-size: 44px;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
  }

  .piece-glyph.white { color: var(--ivory); -webkit-text-stroke: 0.8px var(--charcoal); }
  .piece-glyph.black { color: var(--charcoal); -webkit-text-stroke: 0.5px var(--ivory); }

  .move-dot {
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: rgba(20, 128, 122, 0.75);
    pointer-events: none;
  }

  .capture-ring {
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    border: 4px solid rgba(224, 96, 63, 0.85);
    pointer-events: none;
  }

  .side-panel {
    width: 280px;
    max-width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .status-block {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.9rem;
  }

  .turn-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
  }

  .turn-swatch {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .turn-swatch.w { background: var(--ivory); border: 1px solid rgba(0,0,0,0.2); }
  .turn-swatch.b { background: var(--charcoal); }

  .notice {
    min-height: 20px;
    font-size: 0.85rem;
    color: var(--slate-dark);
    background: rgba(20, 128, 122, 0.12);
    border-radius: 6px;
    padding: 6px 8px;
  }

  .notice:empty {
    padding: 0;
    min-height: 0;
    background: none;
  }

  .notice.result {
    background: rgba(224, 96, 63, 0.18);
    font-weight: 700;
  }

  .controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  button.action {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--slate-dark);
    background: var(--ivory);
    color: var(--slate-dark);
    cursor: pointer;
  }

  button.action:hover:not(:disabled) {
    background: var(--slate);
    color: var(--ivory);
  }

  button.action:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  button.action.claim {
    border-color: var(--coral);
    color: var(--coral);
  }

  button.action.claim:hover:not(:disabled) {
    background: var(--coral);
    color: var(--ivory);
  }

  .move-log-wrap {
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: 8px 0;
  }

  .move-log-title {
    font-size: 0.8rem;
    font-weight: 700;
    margin: 0 0 6px;
    color: var(--slate-dark);
  }

  #move-log {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 160px;
    overflow-y: auto;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #move-log li {
    display: flex;
    gap: 6px;
  }

  .move-log-num {
    color: #7a7264;
    min-width: 22px;
  }

  .legend {
    font-size: 0.78rem;
    line-height: 1.5;
    color: #4a463f;
  }

  .legend-title {
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--slate-dark);
  }

  .legend-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px 8px;
  }

  .legend-grid span.glyph {
    font-size: 1.1rem;
    margin-right: 4px;
  }

  .dialog-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 20, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .dialog-overlay[hidden] {
    display: none;
  }

  .dialog-box {
    background: var(--ivory);
    border-radius: 8px;
    padding: 20px;
    width: 300px;
    max-width: 90vw;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .dialog-box p {
    margin: 0 0 16px;
    font-size: 0.9rem;
    color: var(--charcoal);
  }

  .dialog-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .promo-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 4px;
  }

  .promo-btn {
    font-family: inherit;
    font-size: 1.6rem;
    padding: 10px 4px 4px;
    border-radius: 6px;
    border: 1px solid var(--slate-dark);
    background: var(--ivory);
    color: var(--charcoal);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .promo-btn .label {
    font-size: 0.68rem;
    font-weight: 600;
  }

  .promo-btn:hover {
    background: var(--slate);
    color: var(--ivory);
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 500px) {
    .board-wrap {
      grid-template-columns: 16px 1fr;
      grid-template-rows: 16px 1fr;
      width: 100%;
    }

    #board {
      width: 100%;
      height: auto;
      font-size: 1.6rem;
    }

    main {
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .side-panel {
      width: 100%;
    }

    h1 {
      font-size: 1.3rem;
    }
  }
@media (max-width: 520px) { .piece-glyph { font-size: clamp(22px, 7vw, 40px); } }
</style>
</head>
<body>
  <header>
    <h1>다음 한 수</h1>
    <p class="subtitle">체스 · 로컬 2인용</p>
  </header>

  <main>
    <div class="board-wrap">
      <div class="corner"></div>
      <div class="col-labels" id="col-labels" aria-hidden="true"></div>
      <div class="row-labels" id="row-labels" aria-hidden="true"></div>
      <div id="board" role="grid" aria-label="체스 8x8 보드"></div>
    </div>

    <section class="side-panel" aria-label="게임 정보 및 조작">
      <div class="status-block">
        <div class="turn-line">
          <span class="turn-swatch" id="turn-swatch"></span>
          <span id="turn-text">백 차례</span>
        </div>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>
      </div>

      <div class="controls">
        <button class="action" id="undo-btn" type="button" disabled>한 수 무르기</button>
        <button class="action" id="flip-btn" type="button">보드 뒤집기</button>
        <button class="action claim" id="claim-fifty-btn" type="button" hidden>50수 무승부 선언</button>
        <button class="action claim" id="claim-threefold-btn" type="button" hidden>3회 동형 무승부 선언</button>
        <button class="action" id="new-game-btn" type="button">새 게임</button>
      </div>

      <div class="move-log-wrap">
        <p class="move-log-title">기보</p>
        <ol id="move-log" aria-label="이동 기록"></ol>
      </div>

      <div class="legend">
        <p class="legend-title">기물 안내</p>
        <div class="legend-grid">
          <span><span class="glyph">♔</span>킹</span>
          <span><span class="glyph">♕</span>퀸</span>
          <span><span class="glyph">♖</span>룩</span>
          <span><span class="glyph">♗</span>비숍</span>
          <span><span class="glyph">♘</span>나이트</span>
          <span><span class="glyph">♙</span>폰</span>
        </div>
      </div>
    </section>
  </main>

  <div class="dialog-overlay" id="dialog-overlay" hidden>
    <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title">
      <p id="dialog-title">진행 중인 게임이 있습니다. 새 게임을 시작할까요?</p>
      <div class="dialog-buttons">
        <button class="action" id="dialog-cancel" type="button">취소</button>
        <button class="action" id="dialog-confirm" type="button">새 게임 시작</button>
      </div>
    </div>
  </div>

  <div class="dialog-overlay" id="promo-overlay" hidden>
    <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="promo-title">
      <p id="promo-title">승진할 기물을 선택하세요.</p>
      <div class="promo-buttons" id="promo-buttons"></div>
    </div>
  </div>

  <span class="visually-hidden" id="live-region" aria-live="polite"></span>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
