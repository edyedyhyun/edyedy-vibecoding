<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘도 무사히 · 똥피하기</title>
<style>
  :root {
    --cream: #fff6e4; --sky: #fff1d6; --navy: #1d2b4f; --navy-soft: #4a5679;
    --coral: #ef7a62; --coral-dark: #d9614a; --teal: #2a9d8f; --teal-dark: #1f7d72;
    --panel: rgba(255, 250, 238, .95);
    --w: min(100vw - 20px, 480px, calc((100vh - 250px) * .8));
  }
  @supports (height: 100dvh) { :root { --w: min(100vw - 20px, 480px, calc((100dvh - 250px) * .8)); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: linear-gradient(#fff1d6, #fffaf0 70%); color: var(--navy);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: 8px 10px 12px; gap: 8px; }
  h1 { margin: 0; font-size: 1.2rem; letter-spacing: .01em; text-align: center; word-break: keep-all; }
  h1 small { font-weight: 600; color: var(--coral-dark); font-size: .85em; }
  .hud, .stage, .controls, .hint { width: var(--w); min-width: 280px; }
  .hud { display: flex; align-items: stretch; gap: 6px; }
  .stat { flex: 1; min-width: 0; background: var(--panel); border: 2px solid var(--navy); border-radius: 12px; padding: 3px 8px;
    display: flex; flex-direction: column; line-height: 1.2; }
  .stat span { font-size: .68rem; font-weight: 700; color: var(--navy-soft); }
  .stat output { font-size: 1rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button { font: inherit; font-weight: 800; cursor: pointer; border: 2px solid var(--navy); color: var(--navy);
    background: var(--cream); border-radius: 12px; padding: 8px 14px; min-height: 40px; touch-action: manipulation; }
  button:hover:not(:disabled) { background: #fff; }
  button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--coral); color: #fff; box-shadow: 0 3px 0 var(--navy); }
  button.primary:hover:not(:disabled) { background: var(--coral-dark); }
  button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--navy); }
  button.link { border: 0; background: none; min-height: 32px; padding: 4px 8px; font-size: .82rem; font-weight: 700;
    color: var(--navy-soft); text-decoration: underline; }
  #pauseBtn { flex: 0 0 46px; padding: 0; font-size: 1.1rem; }
  .stage { position: relative; aspect-ratio: 4 / 5; border: 3px solid var(--navy); border-radius: 18px; overflow: hidden;
    background: var(--sky); box-shadow: 0 8px 24px rgba(29, 43, 79, .18); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center;
    background: rgba(29, 43, 79, .38); }
  .overlay[hidden] { display: none; }
  .card { background: var(--panel); border: 2px solid var(--navy); border-radius: 18px; padding: 14px 18px; max-width: 100%;
    display: flex; flex-direction: column; gap: 8px; align-items: center; min-width: 220px; }
  .card h2 { margin: 0; font-size: 1.35rem; }
  .card p { margin: 0; color: var(--navy-soft); font-size: .92rem; line-height: 1.45; word-break: keep-all; overflow-wrap: break-word; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .badge { display: inline-block; background: var(--teal); color: #fff; border-radius: 999px; padding: 2px 12px; font-weight: 800; font-size: .85rem; }
  .badge[hidden] { display: none; }
  .controls { display: flex; gap: 10px; }
  .hold { flex: 1; min-height: 68px; font-size: 1.15rem; background: var(--cream); user-select: none; -webkit-user-select: none;
    touch-action: none; -webkit-touch-callout: none; box-shadow: 0 4px 0 var(--navy); }
  .hold.on { background: var(--teal); color: #fff; transform: translateY(3px); box-shadow: 0 1px 0 var(--navy); }
  .hint { margin: 0; text-align: center; font-size: .82rem; color: var(--navy-soft); }
  .notice { margin: 0; width: var(--w); min-width: 280px; text-align: center; font-size: .8rem; color: var(--coral-dark); font-weight: 700; }
  .notice:empty { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  kbd { background: var(--panel); border: 1px solid var(--navy-soft); border-radius: 5px; padding: 0 5px; font-size: .9em; }
</style>
</head>
<body>
  <h1>오늘도 무사히 <small>· 똥피하기</small></h1>

  <div class="hud">
    <div class="stat"><span>생존 시간</span><output id="time">0.0초</output></div>
    <div class="stat"><span>피한 똥</span><output id="dodged">0</output></div>
    <div class="stat"><span>최고 기록</span><output id="best">0.0초</output></div>
    <button id="pauseBtn" type="button" aria-label="일시정지" disabled>⏸</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="480" height="600" role="img" aria-label="똥피하기 게임 화면. 하늘에서 떨어지는 똥을 좌우로 움직여 피하세요."></canvas>

    <div class="overlay" id="readyOverlay" role="group" aria-labelledby="readyTitle">
      <div class="card">
        <h2 id="readyTitle">오늘도 무사히</h2>
        <p>하늘에서 떨어지는 똥을 피해<br>오래오래 버텨 보세요.</p>
        <button id="startBtn" class="primary" type="button">시작하기</button>
        <button class="link resetBest" type="button">기록 지우기</button>
      </div>
    </div>

    <div class="overlay" id="pauseOverlay" role="group" aria-labelledby="pauseTitle" hidden>
      <div class="card">
        <h2 id="pauseTitle">일시정지</h2>
        <p>준비되면 계속하기를 누르세요.</p>
        <div class="row">
          <button id="resumeBtn" class="primary" type="button">계속하기 (P)</button>
          <button id="restartFromPauseBtn" type="button">다시 시작 (R)</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="overOverlay" role="group" aria-labelledby="overTitle" hidden>
      <div class="card">
        <h2 id="overTitle">앗, 맞았어요!</h2>
        <span class="badge" id="recordBadge" hidden>신기록!</span>
        <p id="overText"></p>
        <button id="restartBtn" class="primary" type="button">다시 하기 (R)</button>
        <button class="link resetBest" type="button">기록 지우기</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="leftBtn" class="hold" type="button" aria-label="왼쪽으로 이동 (누르고 있는 동안)" disabled>◀ 왼쪽</button>
    <button id="rightBtn" class="hold" type="button" aria-label="오른쪽으로 이동 (누르고 있는 동안)" disabled>오른쪽 ▶</button>
  </div>

  <p class="hint">← → · A D · 아래 버튼 꾹 누르기</p>
  <p class="notice" id="notice" role="status"></p>
  <p class="sr-only" id="status" role="status" aria-live="polite"></p>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
