<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>먼저 도착할 빛 · Sky Shield</title><style>*{box-sizing:border-box}body{margin:0;background:#eceee7;color:#234238;font-family:system-ui,-apple-system,sans-serif}main{width:min(900px,100%);margin:22px auto;padding:0 18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#687e75}h1{font-size:28px;margin:6px 0}.intro{font-size:14px;color:#64776d;margin:8px 0 15px}.stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}.stats small{font-size:11px;display:block;color:#61776b}.stats strong{font-size:20px;display:block;margin-top:3px}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 310px);object-fit:contain;background:#17332e;border-radius:15px;touch-action:manipulation;cursor:crosshair;outline:none}canvas:focus-visible{outline:3px solid #cc9844}.message{font-size:13px;min-height:22px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:13px;background:#fafbf6;border:1px solid #a8b9ac;color:#29493b;border-radius:8px;padding:11px 15px;cursor:pointer;touch-action:manipulation}button:hover{background:#d8e6db}button:focus-visible{outline:3px solid #c49749}button:disabled{opacity:.4;cursor:default}.primary{background:#325b49;color:white}.primary:hover{background:#426a55}.presets{margin-top:8px}.note{font-size:11px;color:#6c7f73;line-height:1.7;margin:12px 0} @media(max-width:600px){main{margin:12px auto;padding:0 12px}h1{font-size:23px}.stats{gap:18px}.intro{font-size:12px}canvas{max-height:43vh}.controls{gap:6px}button{padding:10px;font-size:12px}.message{min-height:36px}.note{font-size:10px}}</style></head><body><main><header><div class="eyebrow">A SMALL OFFLINE ARCADE · 26</div><h1>먼저 도착할 빛</h1><p class="intro">내려오는 궤적을 보고, 방어탄이 도착할 곳을 정합니다.</p></header><div class="stats"><div><small>방어 차례</small><strong id="wave">1 / 3</strong></div><div><small>남은 기지</small><strong id="bases">3곳</strong></div><div><small>방어탄</small><strong id="ammo">18발</strong></div><div><small>점수</small><strong id="score">0점</strong></div><div><small>막은 미사일</small><strong id="hit">0발</strong></div></div><canvas id="game" width="640" height="480" tabindex="0" role="img" aria-label="미사일 방어 게임판"></canvas><p class="message" id="message" aria-live="polite"></p><div class="controls"><button id="start" class="primary">방어 시작</button><button id="pause">일시정지</button><button id="next">다음 차례</button></div><div class="controls presets"><button id="left">왼쪽 상공</button><button id="center">가운데 상공</button><button id="right">오른쪽 상공</button></div><p class="note">게임판을 클릭하거나 터치하면 해당 지점에 발사합니다. 아래 상공 버튼 또는 1·2·3도 사용 가능.<br>P 일시정지 · 기지가 모두 파괴되면 종료 · 기지는 다음 차례에도 유지되고 방어탄은 18발로 보충됩니다.<br>인터넷 없이 실행 · 새로 만든 그림과 규칙으로 구성한 작은 방어 게임</p></main><script src="engine.js"></script><script src="app.js"></script></body></html>
