<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>먼저 도착할 빛 · Sky Shield</title><style>*{box-sizing:border-box}body{margin:0;background:#eceee7;color:#234238;font-family:system-ui,-apple-system,sans-serif}main{width:min(900px,100%);margin:22px auto;padding:0 18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#687e75}h1{font-size:28px;margin:6px 0}.intro{font-size:14px;color:#64776d;margin:8px 0 15px}.stats{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}.stats small{font-size:11px;display:block;color:#61776b}.stats strong{font-size:20px;display:block;margin-top:3px}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 310px);object-fit:contain;background:#17332e;border-radius:15px;touch-action:manipulation;cursor:crosshair;outline:none}canvas:focus-visible{outline:3px solid #cc9844}.message{font-size:13px;min-height:22px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;font-size:13px;background:#fafbf6;border:1px solid #a8b9ac;color:#29493b;border-radius:8px;padding:11px 15px;cursor:pointer;touch-action:manipulation}button:hover{background:#d8e6db}button:focus-visible{outline:3px solid #c49749}button:disabled{opacity:.4;cursor:default}.primary{background:#325b49;color:white}.primary:hover{background:#426a55}.presets{margin-top:8px}.note{font-size:11px;color:#6c7f73;line-height:1.7;margin:12px 0} @media(max-width:600px){main{margin:12px auto;padding:0 12px}h1{font-size:23px}.stats{gap:18px}.intro{font-size:12px}canvas{max-height:43vh}.controls{gap:6px}button{padding:10px;font-size:12px}.message{min-height:36px}.note{font-size:10px}}</style></head><body><main><header><div class="eyebrow">A SMALL OFFLINE ARCADE · 26</div><h1>먼저 도착할 빛</h1><p class="intro">내려오는 궤적을 보고, 방어탄이 도착할 곳을 정합니다.</p></header><div class="stats"><div><small>방어 차례</small><strong id="wave">1 / 3</strong></div><div><small>남은 기지</small><strong id="bases">3곳</strong></div><div><small>방어탄</small><strong id="ammo">18발</strong></div><div><small>점수</small><strong id="score">0점</strong></div><div><small>막은 미사일</small><strong id="hit">0발</strong></div></div><canvas id="game" width="640" height="480" tabindex="0" role="img" aria-label="미사일 방어 게임판"></canvas><p class="message" id="message" aria-live="polite"></p><div class="controls"><button id="start" class="primary">방어 시작</button><button id="pause">일시정지</button><button id="next">다음 차례</button></div><div class="controls presets"><button id="left">왼쪽 상공</button><button id="center">가운데 상공</button><button id="right">오른쪽 상공</button></div><p class="note">게임판을 클릭하거나 터치하면 해당 지점에 발사합니다. 아래 상공 버튼 또는 1·2·3도 사용 가능.<br>P 일시정지 · 기지가 모두 파괴되면 종료 · 기지는 다음 차례에도 유지되고 방어탄은 18발로 보충됩니다.<br>인터넷 없이 실행 · 새로 만든 그림과 규칙으로 구성한 작은 방어 게임</p></main><script>

'use strict';const W=640,H=480,GROUND=420,BASES=[80,320,560],SPEED=220,RADIUS=58;
function create(){return {mode:'ready',wave:1,time:0,spawned:0,next:1,enemies:[],shots:[],bursts:[],bases:[true,true,true],ammo:18,score:0,hit:0,missed:0,cooldown:0,aim:null,message:'세 기지를 지키세요. 빈 하늘을 눌러 방어탄을 보냅니다.'};}
function start(s){if(s.mode==='ready')s.mode='playing';}
function fire(s,x,y){if(s.mode!=='playing'||s.ammo<=0||s.cooldown>0)return false;x=Math.max(16,Math.min(W-16,x));y=Math.max(24,Math.min(350,y));s.shots.push({x:320,y:GROUND,tx:x,ty:y});s.ammo--;s.cooldown=.18;s.aim={x,y};s.message='목표 지점으로 방어탄을 보냈습니다.';return true;}
function radius(b){return b.max*Math.max(0,b.age<.55?b.age/.55:1-(b.age-.55)/1.05);}
function spawn(s){const order=[0,2,1,0,2,1,0,1,2,1],lane=order[s.spawned%order.length],target=BASES[lane],x=s.wave===1?target:Math.max(20,Math.min(620,target+(s.spawned%2?120:-120)));let dx=target-x,dy=GROUND;const d=Math.hypot(dx,dy),speed=55+(s.wave-1)*12;s.enemies.push({x,y:0,fromX:x,vx:dx/d*speed,vy:dy/d*speed,target:lane});s.spawned++;}
function step(s,dt){if(s.mode!=='playing')return;dt=Math.max(0,Math.min(.05,dt));s.time+=dt;s.cooldown=Math.max(0,s.cooldown-dt);const count=6+(s.wave-1)*2;s.next-=dt;if(s.next<=0&&s.spawned<count){spawn(s);s.next+=2-(s.wave-1)*.2;}
for(const b of s.bursts)b.age+=dt;s.bursts=s.bursts.filter(b=>b.age<1.6);
const pending=[];s.shots=s.shots.filter(a=>{let dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<=SPEED*dt){pending.push({x:a.tx,y:a.ty,age:0,max:RADIUS});return false;}a.x+=dx/d*SPEED*dt;a.y+=dy/d*SPEED*dt;return true;});s.bursts.push(...pending);
for(const e of s.enemies){e.x+=e.vx*dt;e.y+=e.vy*dt;}
const chain=[];s.enemies=s.enemies.filter(e=>{if(s.bursts.some(b=>Math.hypot(e.x-b.x,e.y-b.y)<=radius(b)+4)){s.score+=100;s.hit++;chain.push({x:e.x,y:e.y,age:0,max:32});return false;}if(e.y>=GROUND){s.bases[e.target]=false;s.missed++;return false;}return true;});s.bursts.push(...chain);
if(!s.bases.some(Boolean)){s.mode='over';s.message='세 기지가 모두 멈췄습니다. 다시 조준해 볼까요?';}else if(s.spawned>=count&&s.enemies.length===0&&s.shots.length===0){s.mode='clear';s.message=s.wave===3?'세 차례 방어 완료!':'이번 하늘을 지켰습니다. 다음 차례로 갈 수 있습니다.';}}
function next(s){if(s.mode!=='clear'||s.wave>=3)return false;s.wave++;s.time=0;s.spawned=0;s.next=1;s.ammo=18;s.cooldown=0;s.bursts=[];s.shots=[];s.aim=null;s.mode='playing';s.message='기지는 유지하고 방어탄 18발을 새로 받았습니다.';return true;}
return {W,H,GROUND,BASES,SPEED,RADIUS,create,start,fire,radius,spawn,step,next};
});

'use strict';const E=SkyShield,$=id=>document.getElementById(id),c=$('game'),ctx=c.getContext('2d');let s=E.create(),prev=performance.now();
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){ctx.fillStyle='#17332e';ctx.fillRect(0,0,640,480);for(let i=0;i<38;i++){ctx.fillStyle=i%2?'#8faaa088':'#c2ceba77';ctx.fillRect((i*137+43)%640,(i*73+17)%350,2,2);}ctx.fillStyle='#244239';ctx.beginPath();ctx.moveTo(0,390);for(let x=0;x<=640;x+=40)ctx.lineTo(x,365+30*Math.sin(x*.017));ctx.lineTo(640,480);ctx.lineTo(0,480);ctx.fill();ctx.fillStyle='#537262';ctx.fillRect(0,422,640,58);for(let i=0;i<3;i++){let x=E.BASES[i];if(s.bases[i]){round(x-26,402,52,27,5,'#c7b887');round(x-18,387,36,19,4,'#dfd7b6');ctx.fillStyle='#f1bc62';for(let j=0;j<3;j++)ctx.fillRect(x-14+j*11,410,5,8);}else{round(x-26,417,52,12,3,'#314b40');ctx.fillStyle='#789383';ctx.fillRect(x-12,410,14,7);}}round(298,408,44,22,5,'#f19b59');ctx.strokeStyle='#f8ca79';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(320,413);let a=s.aim?Math.atan2(s.aim.y-420,s.aim.x-320):-Math.PI/2;ctx.lineTo(320+Math.cos(a)*26,413+Math.sin(a)*26);ctx.stroke();
for(const e of s.enemies){ctx.strokeStyle='#edaa6a99';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.fromX,0);ctx.lineTo(e.x,e.y);ctx.stroke();ctx.fillStyle='#ffcc82';ctx.beginPath();ctx.arc(e.x,e.y,4,0,Math.PI*2);ctx.fill();}
for(const a of s.shots){ctx.strokeStyle='#8dcdd9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(320,420);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.fillStyle='#d4f4e6';ctx.beginPath();ctx.arc(a.x,a.y,3,0,Math.PI*2);ctx.fill();}
for(const b of s.bursts){let r=E.radius(b);ctx.fillStyle=b.max===32?'#f8d79355':'#88d6c744';ctx.strokeStyle=b.max===32?'#e8c574':'#aadfd0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,r,0,Math.PI*2);ctx.fill();ctx.stroke();}if(s.aim){ctx.strokeStyle='#b4dfc5';ctx.lineWidth=1;ctx.beginPath();ctx.arc(s.aim.x,s.aim.y,8,0,Math.PI*2);ctx.moveTo(s.aim.x-13,s.aim.y);ctx.lineTo(s.aim.x+13,s.aim.y);ctx.moveTo(s.aim.x,s.aim.y-13);ctx.lineTo(s.aim.x,s.aim.y+13);ctx.stroke();}
ctx.fillStyle='#bbceba';ctx.font='12px system-ui';ctx.textAlign='left';ctx.fillText('SKY SHIELD',18,25);ctx.textAlign='right';ctx.fillText(s.time.toFixed(1)+' s',621,25);
if(s.mode!=='playing'){round(155,144,330,133,12,'#e8eddded');ctx.textAlign='center';ctx.fillStyle='#294f3d';ctx.font='bold 24px system-ui';ctx.fillText({ready:'먼저 도착할 빛',paused:'잠깐 멈춤',clear:s.wave===3?'세 차례 방어 완료':'이번 하늘을 지켰습니다',over:'다시 조준해 볼까요?'}[s.mode],320,187);ctx.font='14px system-ui';ctx.fillText(s.mode==='ready'?'현재 위치보다 조금 앞을 보세요':`${s.hit}발 방어 · ${s.score}점`,320,218);ctx.fillText(s.mode==='paused'?'P 또는 계속 방어':s.mode==='clear'&&s.wave<3?'다음 차례에서 이어집니다':'아래 버튼으로 시작',320,245);}
$('wave').textContent=s.wave+' / 3';$('bases').textContent=s.bases.filter(Boolean).length+'곳';$('ammo').textContent=s.ammo+'발';$('score').textContent=s.score+'점';$('hit').textContent=s.hit+'발';$('message').textContent=s.message+(s.mode==='playing'&&s.ammo===0?' 방어탄을 모두 사용했습니다.':'');$('start').textContent=s.mode==='ready'?'방어 시작':'처음부터';$('pause').textContent=s.mode==='paused'?'계속 방어':'일시정지';$('pause').disabled=!['playing','paused'].includes(s.mode);$('next').disabled=s.mode!=='clear'||s.wave>=3;for(const id of ['left','center','right'])$(id).disabled=s.mode!=='playing'||s.ammo<=0;c.setAttribute('aria-label',`미사일 방어 게임, 상태 ${s.mode}, 차례 ${s.wave}, 시간 ${s.time.toFixed(1)}, 기지 ${s.bases.filter(Boolean).length}, 탄 ${s.ammo}, 점수 ${s.score}, 방어 ${s.hit}, 유실 ${s.missed}, 방어탄비행 ${s.shots.length}, 폭발 ${s.bursts.length}, 미사일 `+s.enemies.map(e=>`x${Math.round(e.x)} y${Math.round(e.y)}`).join('; '));}
function pause(){if(s.mode==='playing'){s.mode='paused';s.message='시간과 비행 궤적을 멈췄습니다.';}else if(s.mode==='paused'){s.mode='playing';s.message='방어를 이어갑니다.';}draw();}
