</style><main><header><div><div class="eyebrow">SMALL ARCADE / 24</div><h1>눈덩이 한 바퀴</h1><p>쌓고, 밀고, 한 번에 굴려 보세요.</p></div><span class="tag">SNOW ROLL · OFFLINE</span></header><section class="board"><div class="stats"><span>눈길<strong id="stage">1 / 3</strong></span><span>격파<strong id="fruit">0 / 3</strong></span><span>점수<strong id="score">0</strong></span><span>기회<strong id="lives">3</strong></span></div><canvas id="game" width="800" height="480" role="img" aria-label="눈덩이 게임" tabindex="0"></canvas></section><p id="status" role="status"></p><div class="controls"><button id="start" class="primary">시작</button><button id="pause" disabled>일시정지</button><button id="restart">처음부터</button><span class="spacer"></span><button id="left" aria-label="왼쪽 걷기">←</button><button id="stop" aria-label="멈춤">■</button><button id="right" aria-label="오른쪽 걷기">→</button><button id="shoot">눈 던지기 · Z</button><button id="push">밀기 · X</button><button id="jump" class="primary">점프</button></div><div class="help"><p>키보드 ← → / A D 이동 · Z 눈 던지기 · X 눈덩이 밀기 · SPACE 점프 · P 일시정지</p><p>화면 ← → 버튼은 누르면 계속 걷습니다. ■로 멈추고, 눈을 네 번 맞힌 뒤 가까이에서 밀기 버튼을 누르세요.</p><p>눈덩이는 8초 뒤 풀립니다. 굴러가는 눈덩이는 안전합니다. 세 눈길, 기회 세 번.</p></div></main><script>
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.SnowRoll=factory()})(typeof globalThis!=='undefined'?globalThis:this,()=>{
'use strict';const W=800,H=480,FLOOR=420;

function create(stage=0,score=0,lives=3){let l=levels[stage];return{stage,score,lives,status:'ready',time:0,cooldown:0,invincible:1.5,player:{x:100,y:FLOOR,vy:0,grounded:true,face:1},enemies:l.enemies.map((a,id)=>({id,x:a[0],y:a[1],min:a[2],max:a[3],speed:a[4],dir:-1,state:'free',snow:0,thaw:0,vx:0,vy:0,chain:0})),shots:[],defeated:0,bestChain:0,message:'눈을 네 번 맞히고, 가까이에서 밀어 주세요.',event:'ready'};}
function start(s){if(s.status==='ready')s.status='playing'}
function jump(s){let p=s.player;if(s.status!=='playing'||!p.grounded)return false;p.vy=-515;p.grounded=false;return true}
function fire(s){if(s.status!=='playing'||s.cooldown>0)return false;let p=s.player;s.shots.push({x:p.x+p.face*22,y:p.y-20,vx:p.face*380,age:0});s.cooldown=.22;return true}
function push(s){if(s.status!=='playing')return false;let p=s.player,targets=s.enemies.filter(e=>e.state==='frozen'&&Math.abs(e.x-p.x)<=70&&Math.abs(e.y-p.y)<35).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));if(!targets.length){s.message='눈덩이에 더 가까이 가서 밀어 주세요.';s.event='too-far';return false}let e=targets[0];e.state='rolling';e.vx=p.face*440;e.vy=0;e.chain=0;s.message='굴러갑니다! 같은 길의 적을 만나면 연쇄 점수.';s.event='push';return true}
function defeat(s,e,points){if(e.state==='gone')return;e.state='gone';s.defeated++;s.score+=points}
function step(s,dt,input={}){if(s.status!=='playing')return;dt=Math.min(.025,Math.max(0,dt));s.time+=dt;s.cooldown=Math.max(0,s.cooldown-dt);s.invincible=Math.max(0,s.invincible-dt);let p=s.player,dir=(input.right?1:0)-(input.left?1:0);if(dir)p.face=dir;p.x=Math.max(20,Math.min(W-20,p.x+dir*205*dt));let oldY=p.y;p.vy+=1150*dt;p.y+=p.vy*dt;p.grounded=false;let surfaces=[{x:0,y:FLOOR,w:W},...levels[s.stage].shelves].sort((a,b)=>a.y-b.y);for(let f of surfaces){if(p.vy>=0&&oldY<=f.y+.01&&p.y>=f.y&&p.x+12>f.x&&p.x-12<f.x+f.w){p.y=f.y;p.vy=0;p.grounded=true;break}}
for(let q of s.shots){q.x+=q.vx*dt;q.age+=dt;for(let e of s.enemies){if(e.state==='free'&&Math.abs(q.x-e.x)<23&&Math.abs(q.y-(e.y-20))<22){e.snow++;e.thaw=3;q.age=99;s.event='hit';s.message=`눈 쌓기 ${e.snow}/4`;if(e.snow>=4){e.state='frozen';e.thaw=8;s.event='freeze';s.message='눈덩이가 됐어요. 8초 안에 가까이에서 X로 밀어 주세요.'}break}}}s.shots=s.shots.filter(q=>q.age<.65&&q.x>-20&&q.x<W+20);
for(let e of s.enemies){if(e.state==='free'){e.x+=e.dir*e.speed*dt;if(e.x<e.min){e.x=e.min;e.dir=1}if(e.x>e.max){e.x=e.max;e.dir=-1}if(e.snow>0){e.thaw-=dt;if(e.thaw<=0){e.snow=0;s.event='melt';s.message='덜 쌓인 눈이 녹았어요. 다시 맞혀야 합니다.'}}if(s.invincible<=0&&Math.abs(e.x-p.x)<26&&Math.abs(e.y-p.y)<31){s.lives--;s.invincible=1.8;p.x=100;p.y=FLOOR;p.vy=0;p.grounded=true;s.message='앗! 기회가 줄었어요. 잠시 보호됩니다.';s.event='hurt';if(s.lives<=0){s.status='over';return}}}
else if(e.state==='frozen'){e.thaw-=dt;if(e.thaw<=0){e.state='free';e.snow=0;s.event='escape';s.message='눈덩이가 풀렸어요. 다시 네 번 맞혀 주세요.'}}
else if(e.state==='rolling'){let prev=e.y;e.x+=e.vx*dt;e.vy+=1150*dt;e.y+=e.vy*dt;for(let f of surfaces){if(e.vy>=0&&prev<=f.y+.01&&e.y>=f.y&&e.x+17>f.x&&e.x-17<f.x+f.w){e.y=f.y;e.vy=0;break}}for(let target of s.enemies){if(target!==e&&['free','frozen'].includes(target.state)&&Math.abs(target.x-e.x)<35&&Math.abs(target.y-e.y)<32){e.chain++;defeat(s,target,200*e.chain);s.bestChain=Math.max(s.bestChain,e.chain);s.event='chain';s.message=`${e.chain}연쇄! +${200*e.chain}점`}}if(e.x<-30||e.x>W+30)defeat(s,e,100)}}
if(s.defeated===s.enemies.length){s.status='clear';s.message=s.stage===2?'모든 눈길을 정리했어요!':'이번 눈길 완료! 준비되면 다음 눈길로.';s.event='clear'}}
return{W,H,FLOOR,levels,create,start,jump,fire,push,step};});

</script><script>
'use strict';const E=SnowRoll,$=id=>document.getElementById(id),canvas=$('game'),g=canvas.getContext('2d');let s=E.create(),keys={},walk=0,last=0,acc=0,msg='';
function stop(){keys={};walk=0}
function sync(){$('stage').textContent=`${s.stage+1} / 3`;$('fruit').textContent=`${s.defeated} / ${s.enemies.length}`;$('score').textContent=s.score;$('lives').textContent=s.lives;$('start').hidden=!['ready','clear'].includes(s.status)||s.status==='clear'&&s.stage===2;$('start').textContent=s.status==='clear'?'다음 눈길 →':'시작';$('pause').disabled=!['playing','paused'].includes(s.status);$('pause').textContent=s.status==='paused'?'계속':'일시정지';$('left').setAttribute('aria-pressed',walk===-1);$('right').setAttribute('aria-pressed',walk===1);let text=s.status==='ready'?'눈을 네 번 맞히고, 가까이에서 눈덩이를 밀어 보세요.':s.status==='paused'?'잠깐 멈췄습니다. 눈이 녹는 시간도 멈춥니다.':s.status==='over'?'기회를 모두 썼어요. 처음부터 다시 도전해 보세요.':s.message;if(msg!==text){msg=text;$('status').textContent=text}canvas.setAttribute('aria-label',`눈길 ${s.stage+1}, 격파 ${s.defeated}/${s.enemies.length}, 점수 ${s.score}, 기회 ${s.lives}, 위치 ${Math.round(s.player.x)}, 높이 ${Math.round(s.player.y)}, 눈덩이 ${s.enemies.filter(e=>e.state==='frozen').length}, 굴러가는 공 ${s.enemies.filter(e=>e.state==='rolling').length}, 최고 연쇄 ${s.bestChain}. ${text}`)}
function oval(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function draw(){g.fillStyle='#202d49';g.fillRect(0,0,800,480);g.fillStyle='#314461';for(let x=0;x<800;x+=80){g.fillRect(x,0,2,480)}g.fillStyle='#8babc0';g.font='12px system-ui';g.textAlign='left';g.fillText(E.levels[s.stage].name,22,30);for(let f of[{x:0,y:E.FLOOR,w:800},...E.levels[s.stage].shelves]){g.fillStyle='#5a759a';g.fillRect(f.x,f.y,f.w,18);g.fillStyle='#c1d5e2';g.fillRect(f.x,f.y,f.w,5)}

let p=s.player;g.save();g.globalAlpha=s.invincible>0&&Math.floor(s.time*8)%2===0?.45:1;oval(p.x,p.y-16,14,17,'#e0a36d');oval(p.x,p.y-35,13,13,'#fff0d4');oval(p.x,p.y-42,16,8,'#dc8654');g.fillStyle='#784954';g.fillRect(p.x-12,p.y-26,24,5);oval(p.x-5,p.y-35,2,2,'#263a52');oval(p.x+5,p.y-35,2,2,'#263a52');g.restore();if(s.status!=='playing'){g.fillStyle='#111a2caa';g.fillRect(0,0,800,480);g.textAlign='center';g.fillStyle='#fff0d1';g.font='bold 30px system-ui';g.fillText({ready:'눈덩이 하나로 어디까지?',paused:'잠깐 쉬어가기',clear:s.stage===2?'모두 굴렸어요!':'눈길 정리 완료',over:'다시 한 바퀴?'}[s.status],400,215);g.font='16px system-ui';g.fillStyle='#c4d9df';g.fillText(`격파 ${s.defeated}/${s.enemies.length} · 점수 ${s.score} · 최고 ${s.bestChain}연쇄`,400,253)}}
function pause(){if(s.status==='playing'){s.status='paused';stop()}else if(s.status==='paused')s.status='playing';sync()}
$('start').onclick=()=>{if(s.status==='clear')s=E.create(s.stage+1,s.score,s.lives);stop();E.start(s);sync()};$('pause').onclick=pause;$('restart').onclick=()=>{s=E.create();stop();sync()};$('left').onclick=()=>walk=walk===-1?0:-1;$('right').onclick=()=>walk=walk===1?0:1;$('stop').onclick=stop;$('jump').onclick=()=>E.jump(s);$('shoot').onclick=()=>{E.fire(s);sync()};$('push').onclick=()=>{E.push(s);sync()};
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;let k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' ','z','x'].includes(k))e.preventDefault();if(['arrowleft','a'].includes(k)){keys.left=true;walk=0}if(['arrowright','d'].includes(k)){keys.right=true;walk=0}if(k==='z'){E.fire(s);keys.fire=true}if(!e.repeat){if(k===' ')E.jump(s);if(k==='x')E.push(s);if(k==='p')pause()}});document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(['arrowleft','a'].includes(k))keys.left=false;if(['arrowright','d'].includes(k))keys.right=false;if(k==='z')keys.fire=false});window.addEventListener('blur',()=>{stop();if(s.status==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(s.status==='playing')pause()}});
