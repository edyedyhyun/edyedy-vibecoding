<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저장 오류 테스트 전용</title><style>body{font:16px system-ui;background:#111a27;color:#edf2f7;padding:40px;max-width:750px;margin:auto;line-height:1.8}button,a{display:block;padding:15px;margin:15px 0;font:inherit}button{background:#efbd82;border:0;border-radius:10px;color:#202020}a{color:#b5cbff}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>저장 오류 재현 · 개발 테스트 전용</h1><p>이 페이지는 같은 주소의 게임 저장 기록을 고의로 바꿉니다. 실제 진행이 있는 브라우저에서는 누르지 마세요. 다른 저장 키는 건드리지 않습니다.</p><button id="bad">깨진 JSON으로 기록 교체</button><button id="future">미지원 버전 기록으로 교체</button><button id="inspect">현재 기록 읽기</button><pre id="result"></pre><a href="../index.html">게임 화면 열기</a><script src="../economy.js"></script><script src="../save.js"></script><script>const out=document.getElementById('result');document.getElementById('bad').onclick=()=>{localStorage.setItem(CoinSave.KEY,'{broken-json');out.textContent='깨진 JSON을 넣었습니다. 게임을 열어 오류 안내와 원본 보존을 확인하세요.'};document.getElementById('future').onclick=()=>{localStorage.setItem(CoinSave.KEY,JSON.stringify({version:2,savedAt:0,state:{marker:'keep'}}));out.textContent='미지원 버전2를 넣었습니다.'};document.getElementById('inspect').onclick=()=>{out.textContent=localStorage.getItem(CoinSave.KEY)??'(저장 기록 없음)'}</script></html>
