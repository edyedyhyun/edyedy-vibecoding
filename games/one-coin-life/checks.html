<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제작기 03 · 계산 검증</title><style>body{background:#0d121b;color:#eaf0f7;font:16px system-ui;margin:0}main{max-width:850px;margin:50px auto;padding:24px}small{color:#a9e870;letter-spacing:2px}h1{font-size:36px;letter-spacing:-1px}p{color:#a5b4c6;line-height:1.7}button{padding:14px 20px;background:#a9e870;color:#142012;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}#summary{font-size:24px;color:#a9e870}li{padding:13px 16px;margin:8px 0;background:#182330;border-radius:10px;list-style:none}ul{padding:0}.fail{color:#ffaaaa}a{color:#b4c4d6}</style><main><small>ONE COIN LIFE · DEVELOPMENT CHECKS</small><h1>화면 없이도, 돈 계산은 같아야 한다.</h1><p>게임과 같은 economy.js를 불러와 실제 계산을 검증합니다.<br>버튼을 누르면 10개 조건을 계산하고 결과를 표시합니다.</p><button id="run">계산 검증 실행</button><p id="summary" role="status">아직 실행하지 않았습니다.</p><ul id="results"></ul><p>이 검증은 브라우저 입력과 서버 보안 검증을 대신하지 않습니다.</p><a href="index.html">← 게임으로 돌아가기</a></main><script src="economy.js"></script><script src="tests/economy-cases.js"></script><script>document.getElementById('run').addEventListener('click',()=>{const results=runEconomyChecks(CoinEconomy);const list=document.getElementById('results');list.replaceChildren();for(const r of results){const item=document.createElement('li');item.textContent=(r.passed?'✓ ':'✕ ')+r.name+(r.error?' — '+r.error:'');if(!r.passed)item.className='fail';list.append(item);}document.getElementById('summary').textContent=results.filter(r=>r.passed).length+' / '+results.length+' 통과';});</script></html>
