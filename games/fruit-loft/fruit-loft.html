</style><main><header><div><div class="eyebrow">SMALL ARCADE / 23</div><h1>밤톨이의 과일 창고</h1><p>한 층씩 올라가며, 오늘의 과일을 모아요.</p></div><span class="tag">FRUIT LOFT · OFFLINE</span></header><section class="board"><div class="stats"><span>창고<strong id="stage">1 / 3</strong></span><span>과일<strong id="fruit">0 / 12</strong></span><span>점수<strong id="score">0</strong></span><span>기회<strong id="lives">3</strong></span></div><canvas id="game" width="800" height="540" role="img" aria-label="과일 창고 게임" tabindex="0"></canvas></section><p id="status" role="status"></p><div class="controls"><button id="start" class="primary">시작</button><button id="pause" disabled>일시정지</button><button id="restart">처음부터</button><span class="spacer"></span><button id="left" aria-label="왼쪽 걷기">←</button><button id="stop" aria-label="멈춤">■</button><button id="right" aria-label="오른쪽 걷기">→</button><button id="up" aria-label="사다리 오르기">↑</button><button id="down" aria-label="사다리 내려가기">↓</button><button id="jump" class="primary">점프</button></div><div class="help"><p>키보드 ← → / A D 이동 · ↑ ↓ / W S 사다리 · SPACE 점프 · P 일시정지</p><p>화면 ← → 버튼은 누르면 계속 걷습니다. ■로 멈추고, 사다리 앞에서 ↑ ↓를 누르세요.</p><p>고슴도치는 점프로 피하세요. 피격되어도 모은 과일은 유지됩니다. 세 창고, 기회 세 번.</p></div></main><script>
