<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스네이크 - 바이브코딩 게임 1탄</title>
<style>
  :root {
    --cream: #f5efd8;
    --cream-dark: #e8dfbd;
    --ink: #2f4a3c;
    --ink-dark: #1c2f22;
    --accent: #a5402d;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background-color: var(--cream);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      rgba(47, 74, 60, 0.12) 28px
    );
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--ink-dark);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    color: var(--ink-dark);
    border-bottom: 3px solid var(--ink-dark);
    padding-bottom: 4px;
  }

  .num {
    font-family: "Courier New", monospace;
  }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: min(380px, 92vw, 52vh);
    border: 4px solid var(--ink-dark);
    border-radius: 6px;
    box-shadow: 4px 4px 0 rgba(47, 74, 60, 0.25);
    background: var(--cream);
  }

  canvas#board {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    background: var(--cream);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(245, 239, 216, 0.94);
    text-align: center;
    padding: 10px;
  }

  .overlay-panel p {
    margin: 0 0 8px;
    max-width: 320px;
    line-height: 1.5;
  }

  .overlay-panel .hint {
    font-size: 0.85rem;
    color: var(--ink);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 22px;
    background: var(--ink-dark);
    color: var(--cream);
    border: 2px solid var(--ink-dark);
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: var(--ink);
  }

  .hud {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }

  #pause-button {
    padding: 4px 14px;
    font-size: 0.85rem;
  }

  #status-message {
    min-height: 1.1em;
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    text-align: center;
  }

  .instructions {
    max-width: 380px;
    font-size: 0.82rem;
    text-align: center;
    color: var(--ink);
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(2, 44px);
    gap: 6px;
    justify-content: center;
  }

  .dpad-btn {
    min-width: 44px;
    min-height: 44px;
    font-size: 1.1rem;
    padding: 0;
    line-height: 1;
  }

  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 2; }

  /* 마우스/트랙패드 등 정밀 포인터를 쓰는 넓은 데스크톱 화면에서는
     방향 버튼이 불필요하므로 숨긴다. 터치(coarse) 기기에서는 항상 보임. */
  @media (pointer: fine) and (hover: hover) and (min-width: 640px) {
    .dpad {
      display: none;
    }
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
  <h1>스네이크</h1>

  <div class="hud">
    <span>점수: <strong id="score" class="num">0</strong></span>
    <span>최고점수: <strong id="high-score" class="num">0</strong></span>
    <button id="pause-button" type="button" hidden>일시정지</button>
  </div>

  <p id="status-message" role="status" aria-live="polite"></p>

  <div class="board-wrap">
    <canvas
      id="board"
      width="400"
      height="400"
      role="img"
      aria-label="스네이크 게임판, 가로 20칸 세로 20칸"
      tabindex="0"
    ></canvas>

    <div class="overlay" id="overlay">
      <div class="overlay-panel" id="panel-ready">
        <p>방향키 또는 W A S D로 뱀을 움직여 먹이를 먹으세요.<br />벽이나 자기 몸에 부딪히면 게임이 끝나요.<br />Space 또는 P 키로 언제든 일시정지할 수 있어요.</p>
        <button id="start-button" type="button">시작하기</button>
      </div>
      <div class="overlay-panel" id="panel-paused" hidden>
        <p>일시정지</p>
        <p class="hint">Space, P 또는 계속하기 버튼으로 다시 시작해요.</p>
        <button id="resume-button" type="button">계속하기</button>
      </div>
      <div class="overlay-panel" id="panel-result" hidden>
        <p id="result-text"></p>
        <button id="restart-button" type="button">다시하기</button>
      </div>
    </div>
  </div>

  <div class="dpad">
    <button class="dpad-btn dpad-up" type="button" data-dir="UP" aria-label="위로 이동">▲</button>
    <button class="dpad-btn dpad-left" type="button" data-dir="LEFT" aria-label="왼쪽으로 이동">◀</button>
    <button class="dpad-btn dpad-right" type="button" data-dir="RIGHT" aria-label="오른쪽으로 이동">▶</button>
    <button class="dpad-btn dpad-down" type="button" data-dir="DOWN" aria-label="아래로 이동">▼</button>
  </div>

  <p class="instructions">20 x 20 칸 보드입니다. 방향키(↑↓←→) 또는 W/A/S/D 키로 이동, Space/P로 일시정지, 화면의 방향 버튼으로도 조작할 수 있어요.</p>

  <script>
/*
 * Snake 게임 순수 로직 엔진 (state/render 분리 - 이 파일은 렌더링을 전혀 하지 않음)
 *
 * 브라우저에서는 <script src="engine.js"><\/script> 로 불러오면
 * 전역 SnakeEngine 객체로 사용할 수 있고,
 * Node.js 등 CommonJS 환경에서는 require('./engine.js') 로 사용할 수 있다.
 * (나중에 stage 2 이후 node 기반 테스트 코드 작성을 위해 두 방식 모두 지원)
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.SnakeEngine = factory();
  }
}(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var GRID_SIZE_DEFAULT = 20;

  var DIRECTIONS = {
    UP: { x: 0, y: -1 },
    DOWN: { x: 0, y: 1 },
    LEFT: { x: -1, y: 0 },
    RIGHT: { x: 1, y: 0 }
  };

  var OPPOSITE = {
    UP: 'DOWN',
    DOWN: 'UP',
    LEFT: 'RIGHT',
    RIGHT: 'LEFT'
  };

  function createInitialSnake(gridSize) {
    var row = Math.floor(gridSize / 2);
    var headCol = Math.floor(gridSize / 2);
    // 머리가 배열의 첫 번째 요소. 처음엔 오른쪽을 향해 3칸짜리 몸으로 시작.
    return [
      { x: headCol, y: row },
      { x: headCol - 1, y: row },
      { x: headCol - 2, y: row }
    ];
  }

  function isOnSnake(snake, x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  // 뱀이 차지하지 않은 칸 중 하나를 무작위로 골라 먹이로 놓는다.
  // 빈 칸이 하나도 없으면(=보드가 가득 참) null을 반환한다.
  function placeFood(snake, gridSize) {
    var emptyCells = [];
    for (var y = 0; y < gridSize; y++) {
      for (var x = 0; x < gridSize; x++) {
        if (!isOnSnake(snake, x, y)) {
          emptyCells.push({ x: x, y: y });
        }
      }
    }
    if (emptyCells.length === 0) return null;
    var idx = Math.floor(Math.random() * emptyCells.length);
    return emptyCells[idx];
  }

  // status: 'ready' | 'running' | 'paused' | 'gameover' | 'cleared'
  function createGame(gridSize) {
    gridSize = gridSize || GRID_SIZE_DEFAULT;
    var snake = createInitialSnake(gridSize);
    return {
      gridSize: gridSize,
      snake: snake,
      direction: 'RIGHT',
      pendingDirection: null,
      food: placeFood(snake, gridSize),
      score: 0,
      status: 'ready'
    };
  }

  function startGame(state) {
    if (state.status === 'ready') {
      state.status = 'running';
    }
    return state;
  }

  function pauseGame(state) {
    if (state.status === 'running') {
      state.status = 'paused';
    }
    return state;
  }

  function resumeGame(state) {
    if (state.status === 'paused') {
      state.status = 'running';
    }
    return state;
  }

  function togglePause(state) {
    if (state.status === 'running') return pauseGame(state);
    if (state.status === 'paused') return resumeGame(state);
    return state;
  }

  // 방향 입력을 큐에 저장만 하고 실제 반영은 tick()에서 한 번만 한다.
  //
  // 규칙 (한 틱당 회전은 최대 한 번만 유효해야 한다):
  // 1) 이번 틱에 적용될 회전이 이미 예약돼 있으면(pendingDirection) 이후에
  //    들어오는 입력은 전부 무시한다. 큐에 쌓인 값을 다시 덮어쓰지 않는다.
  //    (버그 수정 전에는 두 번째 입력이 "직전에 예약된 방향"을 기준으로
  //    반대 방향인지만 검사해서 덮어썼기 때문에, 실제로는 아직 반영되지
  //    않은 실제 진행 방향(state.direction) 기준으로는 정반대인 회전이
  //    통과해버려 몸으로 파고드는 오류가 있었다.)
  // 2) 반대 방향 여부는 항상 "현재 실제로 이동 중인 방향"(state.direction)
  //    기준으로만 판단한다.
  // 3) 현재 진행 방향과 같은 키 입력은 회전을 예약하지 않는다(소모하지 않음).
  function setDirection(state, dirName) {
    if (!DIRECTIONS[dirName]) return state;
    if (state.status !== 'running' && state.status !== 'ready') return state;
    if (state.pendingDirection) return state;
    if (dirName === state.direction) return state;
    if (OPPOSITE[dirName] === state.direction) return state;
    state.pendingDirection = dirName;
    return state;
  }

  function tick(state) {
    if (state.status !== 'running') return state;

    var direction = state.pendingDirection || state.direction;
    state.direction = direction;
    state.pendingDirection = null;

    var vector = DIRECTIONS[direction];
    var head = state.snake[0];
    var newHead = { x: head.x + vector.x, y: head.y + vector.y };

    // 벽 충돌
    if (
      newHead.x < 0 ||
      newHead.x >= state.gridSize ||
      newHead.y < 0 ||
      newHead.y >= state.gridSize
    ) {
      state.status = 'gameover';
      return state;
    }

    var willEat = !!state.food && newHead.x === state.food.x && newHead.y === state.food.y;

    // 몸 충돌 검사: 먹이를 먹지 않으면 꼬리 칸은 이번 이동으로 비워지므로
    // 충돌 판정 대상에서 제외한다 (그렇지 않으면 꼬리를 바짝 뒤따라가는
    // 정상적인 이동도 충돌로 오판된다).
    var bodyToCheck = willEat ? state.snake : state.snake.slice(0, -1);
    if (isOnSnake(bodyToCheck, newHead.x, newHead.y)) {
      state.status = 'gameover';
      return state;
    }

    var newSnake = [newHead].concat(state.snake);
    if (!willEat) {
      newSnake.pop();
    }
    state.snake = newSnake;

    if (willEat) {
      state.score += 10;
    }

    // 보드를 완전히 채우면 게임 종료(클리어)
    if (state.snake.length >= state.gridSize * state.gridSize) {
      state.status = 'cleared';
      state.food = null;
      return state;
    }

    if (willEat) {
      state.food = placeFood(state.snake, state.gridSize);
      if (!state.food) {
        // 위 길이 체크에서 대부분 걸러지지만 만약을 위한 안전망
        state.status = 'cleared';
      }
    }

    return state;
  }

  function resetGame(state) {
    return createGame(state.gridSize);
  }

  return {
    GRID_SIZE_DEFAULT: GRID_SIZE_DEFAULT,
    DIRECTIONS: DIRECTIONS,
    createGame: createGame,
    startGame: startGame,
    pauseGame: pauseGame,
    resumeGame: resumeGame,
    togglePause: togglePause,
    setDirection: setDirection,
    tick: tick,
    resetGame: resetGame
  };
}));

</script>
  <script>
/*
 * 화면 표시 및 입력 처리 담당 (렌더링 계층).
 * 게임 규칙 자체는 engine.js 에만 있고, 여기서는 그 결과를 그리고
 * 키보드/터치/버튼 입력을 engine 함수 호출로 옮기는 역할만 한다.
 */
(function () {
  'use strict';

  var GRID_SIZE = 20;
  var TICK_MS = 150; // 고정 속도 (난이도 단계는 이번 스테이지 범위 밖)
  var HIGH_SCORE_KEY = 'edyedy-vibecoding-snake-high-score';

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var CELL_SIZE = canvas.width / GRID_SIZE;

  var scoreEl = document.getElementById('score');
  var highScoreEl = document.getElementById('high-score');
  var statusEl = document.getElementById('status-message');
  var pauseButton = document.getElementById('pause-button');

  var overlay = document.getElementById('overlay');
  var panelReady = document.getElementById('panel-ready');
  var panelPaused = document.getElementById('panel-paused');
  var panelResult = document.getElementById('panel-result');
  var resultText = document.getElementById('result-text');

  var startButton = document.getElementById('start-button');
  var resumeButton = document.getElementById('resume-button');
  var restartButton = document.getElementById('restart-button');
  var dpadButtons = document.querySelectorAll('.dpad-btn');

  var KEY_TO_DIRECTION = {
    ArrowUp: 'UP',
    ArrowDown: 'DOWN',
    ArrowLeft: 'LEFT',
    ArrowRight: 'RIGHT',
    w: 'UP',
    W: 'UP',
    s: 'DOWN',
    S: 'DOWN',
    a: 'LEFT',
    A: 'LEFT',
    d: 'RIGHT',
    D: 'RIGHT'
  };

  var state = SnakeEngine.createGame(GRID_SIZE);
  var loopId = null;

  // ---- 최고 점수 (localStorage) ----
  // 개인정보/사설 브라우징 모드 등으로 접근이 막혀 있을 수 있으므로
  // try/catch로 감싸고, 실패하면 최고 점수 기능만 조용히 비활성화한다.
  var storageAvailable = true;
  var highScore = 0;

  (function loadHighScore() {
    try {
      var probeKey = '__snake_storage_probe__';
      window.localStorage.setItem(probeKey, '1');
      window.localStorage.removeItem(probeKey);
      var saved = window.localStorage.getItem(HIGH_SCORE_KEY);
      highScore = saved ? parseInt(saved, 10) || 0 : 0;
    } catch (err) {
      storageAvailable = false;
      highScore = 0;
    }
  }());

  function saveHighScoreIfNeeded() {
    if (state.score <= highScore) return;
    highScore = state.score;
    if (!storageAvailable) return;
    try {
      window.localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
    } catch (err) {
      storageAvailable = false;
    }
  }

  function updateScoreDisplay() {
    scoreEl.textContent = String(state.score);
    highScoreEl.textContent = String(highScore);
  }

  function draw() {
    // 배경 (크림색 노트 느낌)
    ctx.fillStyle = '#f5efd8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 격자선
    ctx.strokeStyle = 'rgba(47, 74, 60, 0.15)';
    ctx.lineWidth = 1;
    for (var i = 0; i <= GRID_SIZE; i++) {
      var pos = i * CELL_SIZE + 0.5;
      ctx.beginPath();
      ctx.moveTo(pos, 0);
      ctx.lineTo(pos, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, pos);
      ctx.lineTo(canvas.width, pos);
      ctx.stroke();
    }

    // 먹이
    if (state.food) {
      ctx.fillStyle = '#a5402d';
      var fx = state.food.x * CELL_SIZE + CELL_SIZE / 2;
      var fy = state.food.y * CELL_SIZE + CELL_SIZE / 2;
      ctx.beginPath();
      ctx.arc(fx, fy, CELL_SIZE / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 뱀 몸통
    for (var s = state.snake.length - 1; s >= 0; s--) {
      var seg = state.snake[s];
      ctx.fillStyle = s === 0 ? '#1c2f22' : '#345c40';
      ctx.fillRect(
        seg.x * CELL_SIZE + 1,
        seg.y * CELL_SIZE + 1,
        CELL_SIZE - 2,
        CELL_SIZE - 2
      );
    }
  }

  function showPanel(name) {
    panelReady.hidden = name !== 'ready';
    panelPaused.hidden = name !== 'paused';
    panelResult.hidden = name !== 'result';
    overlay.hidden = name === null;
  }

  function stopLoop() {
    if (loopId !== null) {
      clearInterval(loopId);
      loopId = null;
    }
  }

  // 현재 state.status 값에 맞춰 오버레이/버튼/스크린리더용 상태 문구를 동기화한다.
  function syncUI() {
    if (state.status === 'ready') {
      showPanel('ready');
      pauseButton.hidden = true;
      statusEl.textContent = '';
    } else if (state.status === 'running') {
      showPanel(null);
      pauseButton.hidden = false;
      pauseButton.textContent = '일시정지';
      statusEl.textContent = '';
    } else if (state.status === 'paused') {
      showPanel('paused');
      pauseButton.hidden = false;
      pauseButton.textContent = '계속하기';
      statusEl.textContent = '일시정지되었습니다.';
    } else if (state.status === 'gameover') {
      stopLoop();
      saveHighScoreIfNeeded();
      resultText.textContent = '게임 오버! 점수 ' + state.score + '점.';
      showPanel('result');
      pauseButton.hidden = true;
      statusEl.textContent = '게임 오버! 점수 ' + state.score + '점입니다. 다시하기를 눌러주세요.';
    } else if (state.status === 'cleared') {
      stopLoop();
      saveHighScoreIfNeeded();
      resultText.textContent = '축하합니다! 보드를 가득 채워 클리어했어요. 점수 ' + state.score + '점.';
      showPanel('result');
      pauseButton.hidden = true;
      statusEl.textContent = '축하합니다! 점수 ' + state.score + '점으로 클리어했습니다.';
    }
    updateScoreDisplay();
  }

  function frame() {
    SnakeEngine.tick(state);
    draw();
    syncUI();
  }

  function beginRun() {
    stopLoop();
    draw();
    syncUI();
    loopId = setInterval(frame, TICK_MS);
  }

  function handleStart() {
    SnakeEngine.startGame(state);
    beginRun();
    canvas.focus({ preventScroll: true });
  }

  function handleRestart() {
    state = SnakeEngine.createGame(GRID_SIZE);
    SnakeEngine.startGame(state);
    beginRun();
    canvas.focus({ preventScroll: true });
  }

  // 일시정지/재개 토글. running -> paused 로 갈 땐 타이머를 완전히 멈추고,
  // paused -> running 으로 돌아올 땐 타이머를 다시 건다.
  function handleTogglePause() {
    if (state.status === 'running') {
      SnakeEngine.pauseGame(state);
      stopLoop();
      syncUI();
    } else if (state.status === 'paused') {
      SnakeEngine.resumeGame(state);
      syncUI();
      loopId = setInterval(frame, TICK_MS);
    }
  }

  function autoPauseIfRunning() {
    if (state.status === 'running') {
      handleTogglePause();
    }
  }

  startButton.addEventListener('click', handleStart);
  resumeButton.addEventListener('click', handleTogglePause);
  restartButton.addEventListener('click', handleRestart);
  pauseButton.addEventListener('click', handleTogglePause);

  for (var d = 0; d < dpadButtons.length; d++) {
    dpadButtons[d].addEventListener('click', function (event) {
      var dir = event.currentTarget.getAttribute('data-dir');
      SnakeEngine.setDirection(state, dir);
    });
  }

  window.addEventListener('keydown', function (event) {
    var isPauseKey = event.key === ' ' || event.code === 'Space' || event.key === 'p' || event.key === 'P';
    var dir = KEY_TO_DIRECTION[event.key];
    if (!isPauseKey && !dir) return;

    // 방향키/스페이스로 페이지가 스크롤되는 것을 막는다.
    event.preventDefault();

    // 키를 길게 누르고 있을 때 브라우저가 반복 발생시키는 keydown은 무시한다.
    // (일시정지가 깜빡이거나 방향이 불필요하게 반복 예약되는 것을 방지)
    if (event.repeat) return;

    if (isPauseKey) {
      if (state.status === 'running' || state.status === 'paused') {
        handleTogglePause();
      }
      return;
    }

    SnakeEngine.setDirection(state, dir);
  });

  // 탭이 백그라운드로 가거나(visibilitychange) 창 포커스를 잃으면(blur)
  // 진행 중인 게임을 자동으로 일시정지한다. 자동으로 재개하지는 않는다.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) autoPauseIfRunning();
  });
  window.addEventListener('blur', autoPauseIfRunning);

  // 시작 전 초기 화면(빈 보드 + 뱀 초기 위치)을 미리 그려둔다.
  draw();
  syncUI();
})();

</script>
</body>
</html>
