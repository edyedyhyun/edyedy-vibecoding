<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스네이크 - 바이브코딩 게임 1탄 (개발용)</title>
<style>
  :root {
    --cream: #f5efd8;
    --cream-dark: #e8dfbd;
    --ink: #2f4a3c;
    --ink-dark: #1c2f22;
    --accent: #a5402d;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background-color: var(--cream);
    background-image: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 27px,
      rgba(47, 74, 60, 0.12) 28px
    );
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
    color: var(--ink-dark);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.1em;
    color: var(--ink-dark);
    border-bottom: 3px solid var(--ink-dark);
    padding-bottom: 4px;
  }

  .num {
    font-family: "Courier New", monospace;
  }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: min(380px, 92vw, 52vh);
    border: 4px solid var(--ink-dark);
    border-radius: 6px;
    box-shadow: 4px 4px 0 rgba(47, 74, 60, 0.25);
    background: var(--cream);
  }

  canvas#board {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    background: var(--cream);
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(245, 239, 216, 0.94);
    text-align: center;
    padding: 10px;
  }

  .overlay-panel p {
    margin: 0 0 8px;
    max-width: 320px;
    line-height: 1.5;
  }

  .overlay-panel .hint {
    font-size: 0.85rem;
    color: var(--ink);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 22px;
    background: var(--ink-dark);
    color: var(--cream);
    border: 2px solid var(--ink-dark);
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background: var(--ink);
  }

  .hud {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
  }

  #pause-button {
    padding: 4px 14px;
    font-size: 0.85rem;
  }

  #status-message {
    min-height: 1.1em;
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    text-align: center;
  }

  .instructions {
    max-width: 380px;
    font-size: 0.82rem;
    text-align: center;
    color: var(--ink);
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(2, 44px);
    gap: 6px;
    justify-content: center;
  }

  .dpad-btn {
    min-width: 44px;
    min-height: 44px;
    font-size: 1.1rem;
    padding: 0;
    line-height: 1;
  }

  .dpad-up { grid-column: 2; grid-row: 1; }
  .dpad-left { grid-column: 1; grid-row: 2; }
  .dpad-right { grid-column: 3; grid-row: 2; }
  .dpad-down { grid-column: 2; grid-row: 2; }

  /* 마우스/트랙패드 등 정밀 포인터를 쓰는 넓은 데스크톱 화면에서는
     방향 버튼이 불필요하므로 숨긴다. 터치(coarse) 기기에서는 항상 보임. */
  @media (pointer: fine) and (hover: hover) and (min-width: 640px) {
    .dpad {
      display: none;
    }
  }

  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>
  <h1>스네이크</h1>

  <div class="hud">
    <span>점수: <strong id="score" class="num">0</strong></span>
    <span>최고점수: <strong id="high-score" class="num">0</strong></span>
    <button id="pause-button" type="button" hidden>일시정지</button>
  </div>

  <p id="status-message" role="status" aria-live="polite"></p>

  <div class="board-wrap">
    <canvas
      id="board"
      width="400"
      height="400"
      role="img"
      aria-label="스네이크 게임판, 가로 20칸 세로 20칸"
      tabindex="0"
    ></canvas>

    <div class="overlay" id="overlay">
      <div class="overlay-panel" id="panel-ready">
        <p>방향키 또는 W A S D로 뱀을 움직여 먹이를 먹으세요.<br />벽이나 자기 몸에 부딪히면 게임이 끝나요.<br />Space 또는 P 키로 언제든 일시정지할 수 있어요.</p>
        <button id="start-button" type="button">시작하기</button>
      </div>
      <div class="overlay-panel" id="panel-paused" hidden>
        <p>일시정지</p>
        <p class="hint">Space, P 또는 계속하기 버튼으로 다시 시작해요.</p>
        <button id="resume-button" type="button">계속하기</button>
      </div>
      <div class="overlay-panel" id="panel-result" hidden>
        <p id="result-text"></p>
        <button id="restart-button" type="button">다시하기</button>
      </div>
    </div>
  </div>

  <div class="dpad">
    <button class="dpad-btn dpad-up" type="button" data-dir="UP" aria-label="위로 이동">▲</button>
    <button class="dpad-btn dpad-left" type="button" data-dir="LEFT" aria-label="왼쪽으로 이동">◀</button>
    <button class="dpad-btn dpad-right" type="button" data-dir="RIGHT" aria-label="오른쪽으로 이동">▶</button>
    <button class="dpad-btn dpad-down" type="button" data-dir="DOWN" aria-label="아래로 이동">▼</button>
  </div>

  <p class="instructions">20 x 20 칸 보드입니다. 방향키(↑↓←→) 또는 W/A/S/D 키로 이동, Space/P로 일시정지, 화면의 방향 버튼으로도 조작할 수 있어요.</p>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
