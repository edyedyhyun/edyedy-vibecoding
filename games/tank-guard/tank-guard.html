<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마지막 기지 · TANK GUARD</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#233b34;font-family:system-ui,-apple-system,sans-serif}main{max-width:790px;margin:auto;padding:24px 18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{letter-spacing:.22em;font-size:11px;font-weight:800;color:#6c786d}h1{font-size:32px;margin:5px 0}header p{margin:0;font-size:13px;color:#68776e}.badge{border:1px solid #a7b6a7;padding:8px 12px;border-radius:30px;font-size:11px}.hud{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-bottom:10px;font-size:13px}.hud strong{font-size:20px;margin-left:4px}button{font:inherit;border:0;cursor:pointer;border-radius:8px;background:#244b3f;color:white;padding:12px 18px;font-weight:700}button:focus-visible{outline:3px solid #e79d37;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.board{position:relative;border:10px solid #29483b;border-radius:14px;box-shadow:0 12px 30px #183c3020;overflow:hidden;background:#152d25}canvas{display:block;width:100%;aspect-ratio:1}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#112b22dc;color:#faf3df;padding:24px;text-align:center;gap:12px}#overlay[hidden]{display:none}#overlay h2{font-size:30px;margin:0}#overlay p{line-height:1.75;max-width:330px;margin:0 0 10px}#overlay button{background:#d9b765;color:#192f26;min-width:155px}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.dpad{display:grid;grid-template-columns:repeat(3,48px);gap:5px}.dpad button{padding:0;height:44px;background:#dce2d7;color:#264536;touch-action:none;user-select:none}.dpad .up{grid-column:2}.dpad .left{grid-column:1}.fire{width:95px;height:80px;background:#cd6c48;touch-action:none;user-select:none}.hint{text-align:center;font-size:12px;color:#667568;line-height:1.8}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:18px;font-size:12px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}.note{text-align:center;color:#637365;font-size:12px;line-height:1.8;border-top:1px solid #ccd4c8;margin-top:20px;padding-top:15px}@media(max-width:480px){main{padding:16px 10px}h1{font-size:25px}.badge{display:none}.board{border-width:6px}.hud{font-size:11px}.hud strong{font-size:16px}.hud button{padding:9px}.hint{display:none}#overlay h2{font-size:25px}#overlay p{font-size:13px}}

@media(min-width:600px){main{max-width:680px;padding-top:16px}header{margin-bottom:12px}h1{font-size:28px}.board{width:min(100%,calc(100svh - 295px));min-width:300px;margin:auto}.controls{max-width:480px;margin:12px auto 0}.legend{margin-top:12px}.note{margin-top:12px;padding-top:10px}.dpad button{height:38px}.fire{height:65px}}

<main><header><div><div class="eyebrow">FIELD NOTES / 14</div><h1>마지막 기지</h1><p>길을 열고, 돌아와 지켜라.</p></div><span class="badge">TANK GUARD · OFFLINE</span></header>
<div class="hud"><span>작전 <strong id="stage">01 / 03</strong></span><span>목숨 <strong id="lives">3</strong></span><span>격파 <strong id="score">0</strong></span><button id="pause">일시정지</button></div>
<div class="board"><canvas id="game" width="720" height="720" aria-label="탱크 기지 방어 게임판"></canvas><div id="overlay"><div class="eyebrow" style="color:#b5c9ac">DEFEND THE LAST BASE</div><h2 id="message">마지막 기지를 지켜라</h2><p id="description">벽돌은 부술 수 있지만 강철벽은 남습니다.<br>적 탱크를 모두 막아 세 번의 작전을 마치세요.</p><button id="primary">작전 시작</button><button id="restart" hidden>처음부터</button></div></div>
<div class="controls"><div class="dpad"><button class="up" data-dir="0" aria-label="위 이동">▲</button><button class="left" data-dir="3" aria-label="왼쪽 이동">◀</button><button data-dir="2" aria-label="아래 이동">▼</button><button data-dir="1" aria-label="오른쪽 이동">▶</button></div><div class="hint">방향키 / WASD 이동 · SPACE 발사<br>P / ESC 일시정지 · R 처음부터</div><button class="fire" id="fire">발사<br>●</button></div>
<div class="legend"><span><i style="background:#76dfab"></i>내 탱크</span><span><i style="background:#ed8261"></i>적 탱크</span><span><i style="background:#a97651"></i>벽돌</span><span><i style="background:#91a5a3"></i>강철</span><span><i style="background:#efd078"></i>기지</span></div><p class="note">내 탄은 기지를 해치지 않습니다. 적탄 한 발이면 기지는 무너집니다.<br>인터넷 연결 없이 실행 · 소리 없음 · 1인용</p></main>
<script>
(function(root){
'use strict';
const N=15, DIR=[[0,-1],[1,0],[0,1],[-1,0]];
const MAPS=[
['...............','...............','..BB..S.S..BB..','..BB.......BB..','......BBB......','SS.BB.....BB.SS','...BB..S..BB...','.......S.......','..SS.......SS..','.....BB.BB.....','..B.........B..','..B..SS.SS..B..','...............','......BBB......','......B.B......'],
['...............','...............','..SS..BBB..SS..','.......B.......','BBB.S.....S.BBB','....S.....S....','..B...BBB...B..','..B.........B..','SS...SS.SS...SS','.....B...B.....','..BB.......BB..','.....S...S.....','...............','......BBB......','......B.B......'],
['...............','...............','...BB..S..BB...','SS.....S.....SS','.....B...B.....','..SS.B...B.SS..','.......B.......','BBB.S.....S.BBB','....S.....S....','..B...S.S...B..','..B.........B..','.....BB.BB.....','...............','......BBB......','......B.B......']
];
class Game{
 constructor(random=Math.random){this.random=random;this.reset();}
 reset(){this.stage=0;this.score=0;this.lives=3;this.load();this.state='ready';}
 load(){this.map=MAPS[this.stage].map(r=>r.split(''));this.player={x:5,y:14,dir:0,move:0,fire:0,immune:2};this.base={x:7,y:14,alive:true};this.enemies=[];this.bullets=[];this.effects=[];this.spawn=1.4;this.remaining=5+this.stage*2;this.state='playing';this.reason='';}
 start(){if(this.state==='ready')this.state='playing';}
 pause(){if(this.state==='playing')this.state='paused';else if(this.state==='paused')this.state='playing';}
 next(){if(this.state==='stageclear'){this.stage++;this.load();}}
 tile(x,y){return x<0||y<0||x>=N||y>=N?'S':this.map[y][x];}
 blocked(x,y,actor){return this.tile(x,y)!=='.'||(x===7&&y===14)||this.enemies.some(e=>e!==actor&&e.x===x&&e.y===y)||(actor!==this.player&&this.player.x===x&&this.player.y===y);}
 shoot(actor,team){if(actor.fire>0)return;actor.fire=team==='player'?.28:1.15-this.stage*.1;const d=DIR[actor.dir];this.bullets.push({x:actor.x+.5+d[0]*.48,y:actor.y+.5+d[1]*.48,dir:actor.dir,team});}
 route(e){ // Breadth-first routing through breakable bricks; steel and base are excluded.
 const q=[[e.x,e.y,-1]], seen=new Set([e.x+','+e.y]);
 for(let i=0;i<q.length;i++){const [x,y,first]=q[i];if((x===7&&y===13)||(x===6&&y===14)||(x===8&&y===14))return first;
 for(let k=0;k<4;k++){const [dx,dy]=DIR[k],nx=x+dx,ny=y+dy,key=nx+','+ny;if(nx<0||ny<0||nx>=N||ny>=N||this.tile(nx,ny)==='S'||(nx===7&&ny===14)||seen.has(key))continue;seen.add(key);q.push([nx,ny,first<0?k:first]);}}
 return 2;}
 hitPlayer(){if(this.player.immune>0)return;this.lives--;this.effects.push({x:this.player.x+.5,y:this.player.y+.5,t:.35});if(this.lives<=0){this.state='lost';this.reason='탱크를 모두 잃었습니다.';}else {const spots=[[5,14],[9,14],[4,13],[10,13],[1,14]];const p=spots.find(([x,y])=>!this.blocked(x,y,this.player))||[5,14];Object.assign(this.player,{x:p[0],y:p[1],immune:2,move:.2,fire:.2});}}
 step(dt,input={}){if(this.state!=='playing')return;dt=Math.min(Math.max(dt,0),.1);while(dt>1e-8&&this.state==='playing'){const d=Math.min(dt,.012);this.tick(d,input);dt-=d;}}
 tick(dt,input){const p=this.player;p.move-=dt;p.fire=Math.max(0,p.fire-dt);p.immune=Math.max(0,p.immune-dt);
 if(Number.isInteger(input.dir)&&input.dir>=0&&input.dir<4){p.dir=input.dir;if(p.move<=0){const d=DIR[p.dir];if(!this.blocked(p.x+d[0],p.y+d[1],p)){p.x+=d[0];p.y+=d[1];}p.move=.13;}}
 if(input.fire)this.shoot(p,'player');
 this.spawn-=dt;if(this.remaining>0&&this.enemies.length<3&&this.spawn<=0){const xs=[1,7,13],x=xs[Math.floor(this.random()*3)];if(!this.blocked(x,0,null)){this.enemies.push({x,y:0,dir:2,move:.6,fire:1});this.remaining--;this.spawn=2.5;}else this.spawn=.4;}
 for(const e of this.enemies){e.move-=dt;e.fire=Math.max(0,e.fire-dt);if(e.move<=0){if(Math.abs(e.x-7)+Math.abs(e.y-14)===1){e.dir=e.x<7?1:e.x>7?3:2;}else{e.dir=this.route(e);const d=DIR[e.dir];if(!this.blocked(e.x+d[0],e.y+d[1],e)){e.x+=d[0];e.y+=d[1];}}e.move=.44-this.stage*.045;}this.shoot(e,'enemy');}
 const keep=[];for(const b of this.bullets){const d=DIR[b.dir];b.x+=d[0]*8*dt;b.y+=d[1]*8*dt;const x=Math.floor(b.x),y=Math.floor(b.y),tile=this.tile(x,y);let hit=false;
 if(tile!=='.'){hit=true;if(tile==='B'){this.map[y][x]='.';this.effects.push({x:x+.5,y:y+.5,t:.22});}}
 else if(x===7&&y===14){hit=true;if(b.team==='enemy'){this.base.alive=false;this.state='lost';this.reason='기지가 파괴되었습니다.';}}
 else if(b.team==='player'){const e=this.enemies.find(e=>e.x===x&&e.y===y);if(e){this.enemies=this.enemies.filter(a=>a!==e);this.score+=100;this.effects.push({x:x+.5,y:y+.5,t:.3});hit=true;}}
 else if(x===p.x&&y===p.y){this.hitPlayer();hit=true;}
 if(!hit)keep.push(b);if(this.state==='lost')break;}
 this.bullets=keep;this.effects=this.effects.filter(e=>(e.t-=dt)>0);
 if(this.state==='playing'&&this.remaining===0&&this.enemies.length===0){this.bullets=[];this.state=this.stage===2?'won':'stageclear';}
 }
}
const api={Game,N,DIR,MAPS};if(typeof module!=='undefined')module.exports=api;else root.TankGuard=api;
})(typeof window!=='undefined'?window:globalThis);

</script><script>
'use strict';
const {Game,N}=TankGuard,g=new Game(),canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),S=canvas.width/N;
const $=s=>document.querySelector(s),held=new Map(),keys=new Map();let prev=performance.now(),tapDir,dirUntil=0,fireUntil=0;
function clear(){held.clear();keys.clear();tapDir=undefined;dirUntil=0;fireUntil=0;}
function pause(){g.pause();clear();}
$('#pause').onclick=pause;$('#primary').onclick=()=>{if(g.state==='ready')g.start();else if(g.state==='paused')g.pause();else if(g.state==='stageclear')g.next();else{g.reset();g.start();}clear();};$('#restart').onclick=()=>{g.reset();clear();};
const dirKeys={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3};
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k in dirKeys||k===' ')e.preventDefault();if(!e.repeat){if(k==='p'||k==='Escape')pause();if(k==='r'&&['paused','lost','won','stageclear'].includes(g.state)){g.reset();clear();}}if(k in dirKeys){keys.set(k,dirKeys[k]);tapDir=dirKeys[k];dirUntil=performance.now()+140;}if(k===' '){keys.set(k,'fire');fireUntil=performance.now()+60;}});
addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
for(const b of document.querySelectorAll('[data-dir],#fire')){b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.set(e.pointerId,b.id==='fire'?'fire':+b.dataset.dir);if(b.id==='fire')fireUntil=performance.now()+60;else{tapDir=+b.dataset.dir;dirUntil=performance.now()+140;}});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,e=>held.delete(e.pointerId));b.addEventListener('contextmenu',e=>e.preventDefault());}
function suspend(){clear();if(g.state==='playing')g.pause();}addEventListener('blur',suspend);document.addEventListener('visibilitychange',()=>{if(document.hidden)suspend();});
function tank(e,color){ctx.save();ctx.translate((e.x+.5)*S,(e.y+.5)*S);ctx.rotate(e.dir*Math.PI/2);ctx.fillStyle='#0d211b';ctx.fillRect(-S*.4,-S*.38,S*.2,S*.76);ctx.fillRect(S*.2,-S*.38,S*.2,S*.76);ctx.fillStyle=color;ctx.fillRect(-S*.25,-S*.3,S*.5,S*.6);ctx.fillStyle='#ffffff55';ctx.fillRect(-S*.12,-S*.15,S*.24,S*.3);ctx.fillStyle=color;ctx.fillRect(-S*.07,-S*.53,S*.14,S*.42);ctx.restore();}
function draw(){ctx.fillStyle='#152d25';ctx.fillRect(0,0,720,720);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=g.map[y][x],px=x*S,py=y*S;ctx.strokeStyle='#ffffff05';ctx.strokeRect(px,py,S,S);if(t==='B'){ctx.fillStyle='#a97651';ctx.fillRect(px+2,py+2,S-4,S-4);ctx.strokeStyle='#684c38';ctx.beginPath();ctx.moveTo(px,py+S/2);ctx.lineTo(px+S,py+S/2);ctx.moveTo(px+S/2,py);ctx.lineTo(px+S/2,py+S/2);ctx.moveTo(px+S/4,py+S/2);ctx.lineTo(px+S/4,py+S);ctx.stroke();}if(t==='S'){ctx.fillStyle='#819994';ctx.fillRect(px+2,py+2,S-4,S-4);ctx.strokeStyle='#b5c8be';ctx.strokeRect(px+7,py+7,S-14,S-14);}}
ctx.fillStyle=g.base.alive?'#efd078':'#6b5148';ctx.beginPath();ctx.moveTo(7.5*S,14.12*S);ctx.lineTo(7.87*S,14.3*S);ctx.lineTo(7.8*S,14.72*S);ctx.lineTo(7.5*S,14.94*S);ctx.lineTo(7.2*S,14.72*S);ctx.lineTo(7.13*S,14.3*S);ctx.closePath();ctx.fill();ctx.fillStyle='#213c30';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText('守',7.5*S,14.66*S);
for(const e of g.enemies)tank(e,'#ed8261');tank(g.player,'#76dfab');if(g.player.immune>0){ctx.strokeStyle='#b9f9d3';ctx.lineWidth=2;ctx.beginPath();ctx.arc((g.player.x+.5)*S,(g.player.y+.5)*S,S*.48,0,Math.PI*2);ctx.stroke();}
for(const b of g.bullets){ctx.fillStyle=b.team==='player'?'#d4ffdf':'#ff987a';ctx.beginPath();ctx.arc(b.x*S,b.y*S,b.team==='player'?4:6,0,Math.PI*2);ctx.fill();}for(const e of g.effects){ctx.strokeStyle='#efd078';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x*S,e.y*S,S*(.55-e.t),0,Math.PI*2);ctx.stroke();}
$('#stage').textContent=`0${g.stage+1} / 03`;$('#lives').textContent=g.lives;$('#score').textContent=g.score/100;$('#pause').disabled=!['playing','paused'].includes(g.state);$('#pause').textContent=g.state==='paused'?'계속하기':'일시정지';$('#overlay').hidden=g.state==='playing';$('#restart').hidden=!['paused','stageclear'].includes(g.state);
const states={ready:['마지막 기지를 지켜라','벽돌은 부술 수 있지만 강철벽은 남습니다. 적 탱크를 모두 막아 세 번의 작전을 마치세요.','작전 시작'],paused:['잠시 정지','이동과 발사를 멈췄습니다. 준비되면 계속하세요.','계속하기'],stageclear:['기지를 지켰습니다',`작전 ${g.stage+1} 완료. 다음 작전에서는 벽 배치와 적의 수가 달라집니다.`,'다음 작전'],lost:['방어 실패',g.reason+' 길을 너무 열지는 않았나요?','다시 도전'],won:['세 번의 작전 완료',`${g.score/100}대 격파. 마지막 기지가 살아남았습니다.`,'다시 도전']};if(states[g.state]){const a=states[g.state];$('#message').textContent=a[0];$('#description').textContent=a[1];$('#primary').textContent=a[2];}}
function frame(t){const values=[...keys.values(),...held.values()],dirs=values.filter(Number.isInteger);g.step((t-prev)/1000,{dir:dirs.at(-1)??(t<dirUntil?tapDir:undefined),fire:values.includes('fire')||t<fireUntil});prev=t;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);

</script></html>
