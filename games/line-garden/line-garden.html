</style><main><header><div><div class="eyebrow">LINE GARDEN / TERRITORY GAME</div><h1>선을 잇는 정원</h1></div><small>욕심보다, 돌아오는 타이밍.</small></header><div class="stats"><div><span>내 땅 / 목표 70%</span><strong id="area">0.0%</strong></div><div><span>남은 기회</span><strong id="lives">● ● ●</strong></div><div><span>플레이 시간</span><strong id="time">00:00</strong></div></div><div class="meter"><i id="progress"></i></div><div class="board"><canvas width="784" height="672" aria-label="땅따먹기 게임판. 방향키 또는 화면 버튼으로 조작"></canvas><div id="veil"><div><h2 id="heading">선을 잇고, 내 땅으로.</h2><p id="desc">테두리는 안전한 땅입니다.<br>선을 그어 다시 연결하면 영역을 얻습니다.<br>붉은 벌레가 선을 건드리기 전에 돌아오세요.</p><button id="mainBtn">시작하기</button></div></div></div><p id="message" role="status">안전한 테두리에서 시작하세요</p><div class="controls"><div class="pad"><button data-dir="up" aria-label="위">↑</button><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="아래">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div><div class="hint">방향키 / WASD · 누르는 동안 이동<br>SPACE / P · 일시정지<br>완성한 땅은 선이 끊겨도 남습니다</div><button id="pause">일시정지</button><button id="reset">새 게임</button></div><footer>오프라인 HTML5 · 1인용 · 원본 디자인 · 소리 없음</footer></main><script>
/* Original grid territory game. Shared by browser and node:test. */
(function(root){
class LineGarden {
 constructor({cols=28,rows=24,goal=70}={}) {Object.assign(this,{cols,rows,goal});this.reset();}
 reset(){this.grid=Array.from({length:this.rows},(_,y)=>Array.from({length:this.cols},(_,x)=>x===0||y===0||x===this.cols-1||y===this.rows-1?1:0));this.player={x:Math.floor(this.cols/2),y:0};this.anchor={...this.player};this.trail=[];this.lives=3;this.state='ready';this.elapsed=0;this.captures=0;this.lastGain=0;this.message='안전한 테두리에서 시작하세요';this.enemies=[{x:6,y:8,dx:1,dy:1},{x:21,y:17,dx:-1,dy:-1}].map(e=>({...e,x:Math.min(e.x,this.cols-2),y:Math.min(e.y,this.rows-2)}));this.enemyClock=0;}
 start(){if(this.state==='ready'||this.state==='paused')this.state='playing';}
 pause(){if(this.state==='playing')this.state='paused';}
 percent(){let n=0;for(let y=1;y<this.rows-1;y++)for(let x=1;x<this.cols-1;x++)if(this.grid[y][x]===1)n++;return n/((this.cols-2)*(this.rows-2))*100;}
 move(dx,dy){if(this.state!=='playing'||Math.abs(dx)+Math.abs(dy)!==1)return;const x=this.player.x+dx,y=this.player.y+dy;if(x<0||y<0||x>=this.cols||y>=this.rows)return;if(this.grid[y][x]===2){this.message='그어진 선으로 되돌아갈 수 없어요';return;}
 if(!this.trail.length&&this.grid[y][x]===0)this.anchor={...this.player};this.player={x,y};
 if(this.grid[y][x]===0){this.grid[y][x]=2;this.trail.push({x,y});this.message='아직 내 땅이 아닙니다 — 안전한 땅으로 돌아오세요';if(this.enemies.some(e=>e.x===x&&e.y===y)){this.hit();return;}}
 else if(this.trail.length)this.capture();
 }
 capture(){const before=this.percent();for(const p of this.trail)this.grid[p.y][p.x]=1;this.trail=[];const seen=new Set(),queue=[];for(const e of this.enemies){const key=e.y*this.cols+e.x;if(this.grid[e.y][e.x]===0&&!seen.has(key)){seen.add(key);queue.push(e);}}
 for(let i=0;i<queue.length;i++){const p=queue[i];for(const [dx,dy]of [[1,0],[-1,0],[0,1],[0,-1]]){let x=p.x+dx,y=p.y+dy,k=y*this.cols+x;if(x>=0&&y>=0&&x<this.cols&&y<this.rows&&this.grid[y][x]===0&&!seen.has(k)){seen.add(k);queue.push({x,y});}}}
 for(let y=1;y<this.rows-1;y++)for(let x=1;x<this.cols-1;x++)if(this.grid[y][x]===0&&!seen.has(y*this.cols+x))this.grid[y][x]=1;
 this.captures++;this.lastGain=this.percent()-before;this.message=`영역 확보 +${this.lastGain.toFixed(1)}%`;if(this.percent()>=this.goal){this.state='won';this.message='정원을 충분히 넓혔습니다!';}}
 hit(){for(const p of this.trail)this.grid[p.y][p.x]=0;this.trail=[];this.player={...this.anchor};this.lives--;this.message='선이 끊겼습니다. 완성한 땅은 남아 있어요';if(this.lives<=0){this.state='lost';this.message='다음에는 조금 일찍 돌아와 볼까요?';}}
 tick(dt){if(this.state!=='playing')return;dt=Math.max(0,Math.min(dt,.25));this.elapsed+=dt;this.enemyClock+=dt;while(this.enemyClock>=.22&&this.state==='playing'){this.enemyClock-=.22;for(const e of this.enemies){let nx=e.x+e.dx,ny=e.y+e.dy;const solid=(x,y)=>!this.grid[y]||this.grid[y][x]===undefined||this.grid[y][x]===1;if(solid(nx,e.y))e.dx*=-1;if(solid(e.x,ny))e.dy*=-1;nx=e.x+e.dx;ny=e.y+e.dy;if(solid(nx,ny)){e.dx*=-1;e.dy*=-1;nx=e.x+e.dx;ny=e.y+e.dy;}if(solid(nx,ny))continue;if(this.grid[ny][nx]===2)this.hit();e.x=nx;e.y=ny;if(this.state!=='playing')break;}}}
}
if(typeof module!=='undefined'&&module.exports)module.exports=LineGarden;else root.LineGarden=LineGarden;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
const game=new LineGarden(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},keys={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};let held=null,repeat=0,last=0;
function clear(){held=null;repeat=0;}
function begin(dir){if(game.state!=='playing')return;held=dir;repeat=0;game.move(...dirs[dir]);}
function pause(){clear();if(game.state==='playing')game.pause();else if(game.state==='paused')game.start();}
$('mainBtn').onclick=()=>{clear();if(['lost','won'].includes(game.state))game.reset();game.start();};$('pause').onclick=pause;$('reset').onclick=()=>{clear();game.reset();};
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;if(keys[e.key]){e.preventDefault();if(!e.repeat)begin(keys[e.key]);}else if([' ','p','P','Escape'].includes(e.key)){e.preventDefault();if(!e.repeat)pause();}});window.addEventListener('keyup',e=>{if(keys[e.key]===held)clear();});
for(const b of document.querySelectorAll('[data-dir]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);begin(b.dataset.dir);};b.onpointerup=clear;b.onpointercancel=clear;b.onlostpointercapture=clear;}
window.addEventListener('blur',()=>{clear();game.pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden){clear();game.pause();}});
function draw(){const s=28;ctx.fillStyle='#183c36';ctx.fillRect(0,0,784,672);for(let y=0;y<game.rows;y++)for(let x=0;x<game.cols;x++){const v=game.grid[y][x];ctx.fillStyle=v===1?'#a8c7a0':v===2?'#efc56b':'#1c443c';ctx.fillRect(x*s+1,y*s+1,s-2,s-2);if(v===1){ctx.fillStyle='#93b78d';ctx.fillRect(x*s+12,y*s+12,3,3);}}
 for(const e of game.enemies){ctx.save();ctx.translate(e.x*s+14,e.y*s+14);ctx.fillStyle='#ee8972';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#542f2c';ctx.fillRect(-5,-3,3,3);ctx.fillRect(2,-3,3,3);ctx.restore();}ctx.fillStyle='#fff8e4';ctx.strokeStyle='#315e49';ctx.lineWidth=3;ctx.beginPath();ctx.arc(game.player.x*s+14,game.player.y*s+14,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#315e49';ctx.fillRect(game.player.x*s+11,game.player.y*s+11,6,6);
 $('area').textContent=game.percent().toFixed(1)+'%';$('progress').style.width=Math.min(100,game.percent()/game.goal*100)+'%';$('lives').textContent='● '.repeat(game.lives)+'○ '.repeat(3-game.lives);$('time').textContent=String(Math.floor(game.elapsed/60)).padStart(2,'0')+':'+String(Math.floor(game.elapsed%60)).padStart(2,'0');$('message').textContent=game.message;$('pause').textContent=game.state==='paused'?'계속하기':'일시정지';$('pause').disabled=!['playing','paused'].includes(game.state);$('veil').hidden=game.state==='playing';if(game.state==='ready'){ $('heading').textContent='선을 잇고, 내 땅으로.';$('desc').innerHTML='테두리는 안전한 땅입니다.<br>선을 그어 다시 연결하면 영역을 얻습니다.<br>붉은 벌레가 선을 건드리기 전에 돌아오세요.';$('mainBtn').textContent='시작하기';}else if(game.state==='paused'){$('heading').textContent='잠깐, 숨 고르기';$('desc').textContent='다음에 그을 선을 생각해 보세요. 이어서 같은 자리에서 시작합니다.';$('mainBtn').textContent='계속하기';}else if(game.state==='won'||game.state==='lost'){$('heading').textContent=game.state==='won'?'정원이 넓어졌습니다!':'이번 정원은 여기까지';$('desc').textContent=`확보한 땅 ${game.percent().toFixed(1)}% · 완성한 선 ${game.captures}개 · ${Math.floor(game.elapsed)}초`;$('mainBtn').textContent='다시 도전';}}
function frame(t){const dt=Math.min((t-last)/1000||0,.1);last=t;if(held&&game.state==='playing'){repeat+=dt;while(repeat>=.105){game.move(...dirs[held]);repeat-=.105;}}game.tick(dt);draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);

</script></html>
