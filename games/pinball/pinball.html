<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 궤도 · PINBALL</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c29;color:#f2ecdc;font-family:system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr 290px;gap:32px;align-items:center;min-height:100vh}.eyebrow{font-size:11px;letter-spacing:3px;color:#bca67d}h1{font-size:36px;margin:12px 0}p{color:#aeb9c3;line-height:1.8;font-size:14px}.board{position:relative;max-width:500px;width:100%;margin:auto}canvas{display:block;width:100%;max-height:calc(100vh - 48px);aspect-ratio:500/760;background:#182c3c;border-radius:110px 110px 24px 24px;border:1px solid #4b5b66;object-fit:contain}.stats{display:flex;gap:22px;margin:25px 0}.stats strong{display:block;font-size:25px;color:#f8d186}.stats span{font-size:11px;color:#aeb9c3}button,select{font:inherit;color:inherit;background:#25394a;border:1px solid #506475;border-radius:10px;padding:12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#f3c97e;color:#152636;font-weight:700;width:100%;border:0}.actions{display:flex;gap:8px;margin:10px 0}.actions button{flex:1}.touch{display:flex;gap:10px;margin-top:18px}.touch button{flex:1;touch-action:none;user-select:none;background:#324e5e;font-weight:700}.touch button:active{background:#a76939}label{font-size:12px;color:#b7c4cc;display:block;margin:16px 0 8px}select{width:100%;font-size:13px}.status{min-height:44px;font-size:14px;color:#f6d18c}footer{font-size:11px;color:#93a4b2;margin-top:20px;line-height:1.8}@media(max-width:650px){main{display:flex;flex-direction:column;padding:12px;gap:12px;min-height:0}.board{max-width:360px}canvas{max-height:42vh}aside{width:100%;max-width:400px}h1{font-size:23px;margin:4px 0}.eyebrow,.intro{display:none}.stats{margin:8px 0;justify-content:space-between}.stats strong{font-size:20px}.actions{margin:6px 0}.touch{margin:8px 0}label{margin:8px 0 4px}footer{margin:8px 0}}
</style><main><div class="board"><canvas width="500" height="760" aria-label="핀볼 게임판. 좌우 버튼으로 플리퍼를 움직이세요."></canvas></div><aside><div class="eyebrow">A LITTLE ARCADE / 16</div><h1>작은 궤도</h1><p class="intro">공 하나, 버튼 두 개.<br>떨어지는 공을 다시 위로 보내세요.</p><div class="stats"><div><span>점수</span><strong id="score">0</strong></div><div><span>남은 공</span><strong id="lives">3</strong></div><div><span>범퍼 히트</span><strong id="hits">0</strong></div></div><p class="status" aria-live="polite" id="status"></p><button class="primary" id="launch">공 발사 · Space</button><div class="actions"><button id="pause">일시정지</button><button id="reset">새 게임</button></div><label for="power">플리퍼 반응 비교 · 공을 발사하기 전에 선택</label><select id="power"><option value="0.55">부드럽게 · 회전 속도 55%</option><option value="1" selected>기본 · 회전 속도 100%</option></select><div class="touch"><button id="left">왼쪽 ◀</button><button id="right">▶ 오른쪽</button></div><footer>← / A · → / D : 누르는 동안 플리퍼 올리기<br>Space : 발사　P / Esc : 정지<br>범퍼 100점 · 공 3개 · 소리 없음<br>누른 채 기다리기보다 공이 닿기 직전에 눌러 보세요.</footer></aside></main><script>
(function(root){
'use strict';
const W=500,H=760,R=9;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
class Pinball{
 constructor(){this.reset();}
 reset(){this.score=0;this.lives=3;this.hits=0;this.elapsed=0;this.mode='ready';this.power=1;this.ball=null;this.input={left:false,right:false};this.flippers=[{x:142,y:638,a:.35,target:.35,w:0},{x:358,y:638,a:Math.PI-.35,target:Math.PI-.35,w:0}];this.bumpers=[{x:178,y:225,r:29,cool:0,flash:0},{x:322,y:225,r:29,cool:0,flash:0},{x:250,y:340,r:32,cool:0,flash:0}];}
 launch(){if(this.mode!=='ready')return;this.ball={x:443,y:500,vx:-155,vy:-880};this.mode='playing';}
 pause(){if(this.mode==='playing'){this.mode='paused';this.release();}else if(this.mode==='paused')this.mode='playing';}
 release(){this.input.left=false;this.input.right=false;}
 segment(ax,ay,bx,by,restitution=0.8,moving=null){let b=this.ball;if(!b)return;const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy,t=clamp(((b.x-ax)*dx+(b.y-ay)*dy)/l2,0,1),px=ax+t*dx,py=ay+t*dy;let nx=b.x-px,ny=b.y-py,d=Math.hypot(nx,ny),radius=R+(moving?8:3);if(d>=radius)return;if(d<.0001){nx=-dy;ny=dx;d=Math.hypot(nx,ny);}nx/=d;ny/=d;b.x=px+nx*radius;b.y=py+ny*radius;let svx=0,svy=0;if(moving){svx=-moving.w*(py-moving.y);svy=moving.w*(px-moving.x);}const vn=(b.vx-svx)*nx+(b.vy-svy)*ny;if(vn<0){b.vx-=(1+restitution)*vn*nx;b.vy-=(1+restitution)*vn*ny;}}
 step(dt){if(this.mode!=='playing')return;const n=Math.ceil(Math.min(dt,.05)/(1/480)),h=Math.min(dt,.05)/n;for(let k=0;k<n&&this.mode==='playing';k++)this.tick(h);}
 tick(h){const b=this.ball;this.elapsed+=h;for(let i=0;i<2;i++){let f=this.flippers[i];f.target=i?(this.input.right?Math.PI+.50:Math.PI-.35):(this.input.left?-.50:.35);let old=f.a;f.a+=clamp(f.target-f.a,-h*13*this.power,h*13*this.power);f.w=(f.a-old)/h;}
 b.vy+=880*h;b.vx*=Math.exp(-.08*h);b.x+=b.vx*h;b.y+=b.vy*h;
 this.segment(26,90,26,554);this.segment(26,90,92,35);this.segment(92,35,408,35);this.segment(408,35,474,90);this.segment(474,90,474,554);this.segment(26,554,127,630);this.segment(474,554,373,630);
 for(const a of this.bumpers){a.cool=Math.max(0,a.cool-h);a.flash=Math.max(0,a.flash-h);let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),r=R+a.r;if(d<r){if(d<.001){dx=0;dy=-1;d=1;}let nx=dx/d,ny=dy/d;b.x=a.x+nx*r;b.y=a.y+ny*r;let vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.85*vn*nx;b.vy-=1.85*vn*ny;b.vx+=nx*140;b.vy+=ny*140;if(!a.cool){this.score+=100;this.hits++;a.cool=.15;a.flash=.18;}}}}
 for(const f of this.flippers)this.segment(f.x,f.y,f.x+Math.cos(f.a)*96,f.y+Math.sin(f.a)*96,.72,f);
 const speed=Math.hypot(b.vx,b.vy);if(speed>1350){b.vx*=1350/speed;b.vy*=1350/speed;}
 if(b.y>H+R){this.lives--;this.ball=null;this.release();this.mode=this.lives?'ready':'over';}
 }
}
if(typeof module!=='undefined')module.exports={Pinball,W,H,R};else root.Pinball=Pinball;
})(typeof window!=='undefined'?window:globalThis);

</script><script>
const game=new Pinball(),c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let prev=performance.now();
function line(x1,y1,x2,y2,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function render(){ctx.clearRect(0,0,500,760);ctx.fillStyle='#182c3c';ctx.fillRect(0,0,500,760);for(let x=50;x<500;x+=40)for(let y=70;y<720;y+=40){ctx.fillStyle='#294253';ctx.beginPath();ctx.arc(x,y,1.1,0,7);ctx.fill();}
ctx.strokeStyle='#547380';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(26,554);ctx.lineTo(26,90);ctx.lineTo(92,35);ctx.lineTo(408,35);ctx.lineTo(474,90);ctx.lineTo(474,554);ctx.stroke();line(26,554,127,630,'#bd9470',9);line(474,554,373,630,'#bd9470',9);
ctx.fillStyle='#ddc69b';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('L I T T L E   O R B I T',250,98);ctx.font='italic 28px Georgia';ctx.fillText('Make it bounce.',250,140);
for(const b of game.bumpers){ctx.fillStyle=b.flash?'#ffe3a0':'#c78356';ctx.shadowColor='#fac576';ctx.shadowBlur=b.flash?30:0;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#edd3a8';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r-7,0,7);ctx.stroke();ctx.fillStyle='#152c3c';ctx.font='bold 14px system-ui';ctx.fillText('100',b.x,b.y+5);}
ctx.strokeStyle='#314f60';ctx.lineWidth=1;ctx.beginPath();ctx.arc(250,320,155,0,7);ctx.stroke();
for(const f of game.flippers){line(f.x,f.y,f.x+Math.cos(f.a)*96,f.y+Math.sin(f.a)*96,'#edc785',16);ctx.fillStyle='#8e663f';ctx.beginPath();ctx.arc(f.x,f.y,5,0,7);ctx.fill();}
line(223,723,277,723,'#b46a58',3);ctx.fillStyle='#7e9aab';ctx.font='11px system-ui';ctx.fillText('D R A I N',250,743);
if(game.ball){const b=game.ball,g=ctx.createRadialGradient(b.x-3,b.y-4,1,b.x,b.y,10);g.addColorStop(0,'#fff');g.addColorStop(.5,'#d6e5e8');g.addColorStop(1,'#657c8a');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();}
if(game.mode!=='playing'){ctx.fillStyle='#102333d9';ctx.fillRect(75,422,350,95);ctx.fillStyle='#f3d29b';ctx.font='bold 22px system-ui';ctx.fillText(game.mode==='paused'?'잠깐 쉬어 가기':game.mode==='over'?'이번 궤도는 여기까지':'다음 공을 올려 보세요',250,462);ctx.font='12px system-ui';ctx.fillText(game.mode==='paused'?'계속하기 버튼으로 돌아오세요':game.mode==='over'?'새 게임으로 다시 도전':'Space 또는 공 발사',250,492);}
$('score').textContent=game.score.toLocaleString();$('lives').textContent=game.lives;$('hits').textContent=game.hits;$('status').textContent=game.mode==='playing'?'공이 내려오면 타이밍을 맞춰 보세요.':game.mode==='ready'?'준비됐으면 공을 발사하세요.':game.mode==='paused'?'시간과 공이 함께 멈췄습니다.':'공 세 개를 모두 사용했습니다.';$('launch').disabled=game.mode!=='ready';$('power').disabled=game.mode==='playing'||game.mode==='paused';$('pause').disabled=game.mode==='ready'||game.mode==='over';$('pause').textContent=game.mode==='paused'?'계속하기':'일시정지';}
function frame(t){game.step((t-prev)/1000);prev=t;render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
$('launch').onclick=()=>game.launch();$('pause').onclick=()=>game.pause();$('reset').onclick=()=>{game.reset();game.power=Number($('power').value);};$('power').onchange=()=>game.power=Number($('power').value);
for(const side of ['left','right']){const el=$(side);el.onpointerdown=e=>{e.preventDefault();el.setPointerCapture(e.pointerId);game.input[side]=true;};el.onpointerup=el.onpointercancel=el.onlostpointercapture=()=>game.input[side]=false;}
window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const key=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' ','p','escape'].includes(key))e.preventDefault();if(key==='arrowleft'||key==='a')game.input.left=true;if(key==='arrowright'||key==='d')game.input.right=true;if(e.repeat)return;if(key===' ')game.launch();if(key==='p'||key==='escape')game.pause();});window.addEventListener('keyup',e=>{if(['arrowleft','a'].includes(e.key.toLowerCase()))game.input.left=false;if(['arrowright','d'].includes(e.key.toLowerCase()))game.input.right=false;});window.addEventListener('blur',()=>{game.release();if(game.mode==='playing')game.pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.mode==='playing')game.pause();});

</script></html>
