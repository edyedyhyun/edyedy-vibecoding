<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방울 정원 · Bubble Garden</title><style>
:root{--bg:#131d32;--ink:#e8edf5;--mute:#a6b7c9;--mint:#a4e8cf;--pink:#f6b7c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}main{max-width:1120px;padding:22px 28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{margin:3px 0;font-size:29px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.22em;color:var(--mint)}header p{margin:0;color:var(--mute);font-size:13px}.badge{font-size:11px;border:1px solid #3b516a;padding:9px 16px;border-radius:30px}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 0 12px}.stats{display:flex;gap:25px}.stats small{display:block;color:var(--mute);font-size:11px}.stats strong{font-size:17px}.actions{display:flex;gap:7px}button{border:1px solid #4f637e;background:#24334c;color:var(--ink);padding:9px 14px;border-radius:10px;font:600 13px system-ui;cursor:pointer;touch-action:none;user-select:none}button:hover{background:#344962}button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}button:disabled{opacity:.45;cursor:default}#next{background:var(--mint);color:#173e35;border-color:var(--mint)}[hidden]{display:none!important}.board{width:min(100%,max(510px,calc((100vh - 320px)*1.7778)));margin:auto;border-radius:18px;border:1px solid #415371;overflow:hidden}canvas{display:block;width:100%;height:auto}#message{font-size:14px;margin:11px 0;min-height:23px}.controls{display:flex;justify-content:space-between;gap:16px;padding:12px 15px;border:1px solid #3a4b65;border-radius:14px;background:#1b2941}.controls>div{display:flex;gap:9px}.controls button{min-width:72px;min-height:42px}#fire{color:var(--mint)}#pop{background:var(--pink);color:#4a2732;border-color:var(--pink)}footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--mute);margin-top:12px}footer p{margin:0}kbd{font:inherit;color:var(--ink)}@media(max-width:650px){main{padding:15px 12px}h1{font-size:25px}.badge{display:none}.bar{align-items:flex-start;flex-direction:column;margin:12px 0}.stats{gap:21px}.board{width:100%}.controls{padding:10px;gap:8px;flex-wrap:wrap}.controls button{min-width:56px;padding:9px 11px}.controls>div:last-child{flex:1;justify-content:flex-end}footer{display:block}#message{font-size:13px}footer p+p{margin-top:6px}}
</style></head><body><main><header><div><div class="eyebrow">BUBBLE GARDEN · A LITTLE NIGHT ARCADE</div><h1>방울 정원</h1><p>가두고, 다가가고, 톡.</p></div><div class="badge">OFFLINE HTML5 · 3 GARDENS</div></header><section class="bar"><div class="stats"><div><small>정원</small><strong id="level"></strong></div><div><small>기회</small><strong id="lives"></strong></div><div><small>터뜨린 방울</small><strong id="count"></strong></div><div><small>점수</small><strong id="score"></strong></div></div><div class="actions"><button id="pause">일시정지</button><button id="retry">이 판 다시</button><button id="next" hidden>다음 정원 →</button></div></section><div class="board"><canvas id="board" width="960" height="540" aria-label="방울 정원 게임판. 좌우 이동, 점프, 방울 발사와 터뜨리기 버튼으로 조작합니다."></canvas></div><p id="message" role="status" aria-live="polite"></p><section class="controls"><div><button id="left" aria-label="왼쪽 이동">←</button><button id="right" aria-label="오른쪽 이동">→</button><button id="jump">점프 ↑</button></div><div><button id="fire">가두기 Z</button><button id="pop">터뜨리기 X</button></div></section><footer><p><kbd>← →</kbd> 이동 · <kbd>↑ / Space</kbd> 점프 · <kbd>Z</kbd> 방울 · <kbd>X</kbd> 가까운 방울 터뜨리기 · <kbd>P</kbd> 정지<br>화면 화살표는 누르는 동안 이동하고, 짧게 누르면 조금 걷습니다. 가둔 적은 6초 뒤 풀려납니다.</p><p>EDYEDY · VIBE CODING NOTES</p></footer></main><script>
(function(root){'use strict';
const W=960,H=540,DT=1/120;
const levels=[
 {name:'방울 하나부터',platforms:[],enemies:[{x:390,y:461,min:300,max:820,speed:36}]},
 {name:'한 층 올라가서',platforms:[{x:300,y:355,w:360}],enemies:[{x:710,y:461,min:520,max:850,speed:42},{x:500,y:336,min:330,max:630,speed:34}]},
 {name:'높은 곳의 방울',platforms:[{x:210,y:355,w:265},{x:545,y:355,w:205},{x:365,y:230,w:235}],enemies:[{x:775,y:461,min:560,max:865,speed:52},{x:330,y:336,min:235,max:448,speed:40},{x:460,y:211,min:390,max:570,speed:32}]}
];
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
class Game{
 constructor(){this.level=0;this.score=0;this.load(0);}
 load(level){this.level=level;this.score=0;this.phase='playing';this.paused=false;this.lives=3;this.player={x:110,y:460,vy:0,face:1,grounded:true,invuln:0};this.enemies=levels[level].enemies.map((e,i)=>({...e,id:i,dir:-1,state:'free',timer:0,homeY:e.y}));this.bubbles=[];this.effects=[];this.cooldown=0;this.popped=0;this.captures=0;this.escapes=0;this.message='Z로 가두고, 가까이에서 X로 터뜨리세요.';this.event='ready';}
 jump(){if(this.paused||this.phase!=='playing'||!this.player.grounded)return false;this.player.vy=-570;this.player.grounded=false;return true;}
 fire(){if(this.paused||this.phase!=='playing'||this.cooldown>0)return false;const p=this.player;this.bubbles.push({x:p.x+p.face*27,y:p.y-4,vx:p.face*340,age:0});this.cooldown=.32;return true;}
 pop(){if(this.paused||this.phase!=='playing')return 0;let n=0;for(const e of this.enemies){if(e.state==='trapped'&&distance(e,this.player)<=120){e.state='gone';this.score+=100;this.popped++;n++;this.effects.push({x:e.x,y:e.y,age:0});}}this.message=n?`톡! ${n}개를 터뜨렸어요. +${n*100}`:'가둔 방울에 조금 더 가까이 가세요.';this.event=n?'pop':'too-far';if(this.popped===this.enemies.length){this.phase='won';this.message=this.level===2?'정원 정리 끝! 세 판을 모두 마쳤어요.':'모든 방울을 터뜨렸어요. 다음 정원으로!';}return n;}
 step(input={},dt=DT){if(this.paused||this.phase!=='playing')return;dt=Math.min(dt,1/30);const p=this.player;this.cooldown=Math.max(0,this.cooldown-dt);p.invuln=Math.max(0,p.invuln-dt);const dir=(input.right?1:0)-(input.left?1:0);if(dir)p.face=dir;p.x=Math.max(24,Math.min(W-24,p.x+dir*220*dt));const oldFeet=p.y+20;p.vy+=1150*dt;p.y+=p.vy*dt;p.grounded=false;for(const s of [{x:0,y:480,w:960},...levels[this.level].platforms]){if(p.vy>=0&&oldFeet<=s.y+.1&&p.y+20>=s.y&&p.x+14>s.x&&p.x-14<s.x+s.w){p.y=s.y-20;p.vy=0;p.grounded=true;}}
 for(const b of this.bubbles){b.age+=dt;b.x+=b.vx*dt;if(b.age>.55){b.vx*=Math.pow(.07,dt);b.y-=58*dt;}for(const e of this.enemies){if(e.state==='free'&&distance(b,e)<36){e.state='trapped';e.timer=6;this.captures++;this.event='capture';this.message='가두기 성공! 6초 안에 가까이에서 X를 누르세요.';b.age=99;break;}}}
 this.bubbles=this.bubbles.filter(b=>b.age<3&&b.x>-30&&b.x<W+30&&b.y>-30);
 for(const e of this.enemies){if(e.state==='trapped'){e.timer-=dt;e.y=Math.max(70,e.y-25*dt);if(e.timer<=0){e.state='free';e.y=e.homeY;e.x=Math.max(e.min,Math.min(e.max,e.x));this.escapes++;this.message='시간이 지나 풀려났어요. 다시 가둬야 해요.';this.event='escape';}}
 else if(e.state==='free'){e.x+=e.dir*e.speed*dt;if(e.x<e.min){e.x=e.min;e.dir=1;}if(e.x>e.max){e.x=e.max;e.dir=-1;}if(p.invuln<=0&&Math.abs(e.x-p.x)<32&&Math.abs(e.y-p.y)<35){this.lives--;p.invuln=1.7;p.x=110;p.y=460;p.vy=0;p.grounded=true;this.message='앗, 닿았어요. 잠깐 반짝일 때 자리를 잡으세요.';this.event='hurt';if(!this.lives){this.phase='lost';this.message='기회를 모두 썼어요. 이 판에서 다시 시작해 보세요.';}}}}
 this.effects.forEach(e=>e.age+=dt);this.effects=this.effects.filter(e=>e.age<.6);
 }
}
const api={Game,levels,W,H,DT};if(typeof module==='object')module.exports=api;else root.BubbleGarden=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('board'),c=canvas.getContext('2d'),game=new BubbleGarden.Game();const keys={left:false,right:false};let last=0,acc=0,ui='',walkUntil={left:0,right:0},clock=0;
function sync(){const s=[game.level,game.lives,game.score,game.popped,game.phase,game.paused,game.message].join('|');if(s===ui)return;ui=s;$('level').textContent=`${game.level+1} / 3`;$('lives').textContent='♥'.repeat(game.lives)||'0';$('count').textContent=game.popped+' / '+game.enemies.length;$('score').textContent=game.score;$('message').textContent=game.paused?'잠깐 쉬는 중 — 이어하기를 누르세요.':game.message;$('pause').textContent=game.paused?'이어하기':'일시정지';$('next').hidden=game.phase!=='won';$('next').textContent=game.level===2?'처음부터 다시':'다음 정원 →';for(const id of ['left','right','jump','fire','pop'])$(id).disabled=game.phase!=='playing'||game.paused;}
function clearInput(){keys.left=keys.right=false;walkUntil.left=walkUntil.right=0;}
function pause(){game.paused=!game.paused;clearInput();sync();}
$('pause').onclick=pause;$('retry').onclick=()=>{game.load(game.level);clearInput();sync();};$('next').onclick=()=>{game.load((game.level+1)%3);clearInput();sync();};$('jump').onclick=()=>game.jump();$('fire').onclick=()=>game.fire();$('pop').onclick=()=>{game.pop();sync();};
for(const id of ['left','right']){const b=$(id);let started=0;b.onpointerdown=e=>{started=performance.now();keys[id]=true;b.setPointerCapture(e.pointerId);};b.onpointerup=()=>{keys[id]=false;if(performance.now()-started<160)walkUntil[id]=clock+.16;};b.onpointercancel=()=>{keys[id]=false;walkUntil[id]=0;};b.onclick=e=>{if(e.detail===0)walkUntil[id]=clock+.18;};}
addEventListener('keydown',e=>{if(e.target.matches('button,input'))return;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')keys.left=true;if(e.code==='ArrowRight')keys.right=true;if(e.repeat)return;if(e.code==='ArrowUp'||e.code==='Space')game.jump();if(e.code==='KeyZ')game.fire();if(e.code==='KeyX')game.pop();if(e.code==='KeyP')pause();});addEventListener('keyup',e=>{if(e.code==='ArrowLeft')keys.left=false;if(e.code==='ArrowRight')keys.right=false;});function blur(){clearInput();if(game.phase==='playing'){game.paused=true;sync();}}addEventListener('blur',blur);document.addEventListener('visibilitychange',()=>{if(document.hidden)blur();});
function circle(x,y,r,fill){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle=fill;c.fill();}
function bubble(x,y,r,alpha=1){c.save();c.globalAlpha=alpha;circle(x,y,r,'rgba(148,224,224,.12)');c.strokeStyle='#a6dfed';c.lineWidth=2;c.stroke();c.beginPath();c.arc(x,y,r-5,3.5,4.8);c.strokeStyle='#fbe1f2';c.lineWidth=3;c.stroke();c.restore();}
function enemy(e){c.save();c.translate(e.x,e.y);circle(0,0,17,'#f3ae87');c.fillStyle='#e28b73';c.beginPath();c.moveTo(-15,-7);c.lineTo(-17,-24);c.lineTo(-3,-14);c.fill();c.beginPath();c.moveTo(15,-7);c.lineTo(17,-24);c.lineTo(3,-14);c.fill();circle(-6,-2,2.5,'#543552');circle(6,-2,2.5,'#543552');c.fillStyle='#543552';c.fillRect(-4,7,8,2);c.restore();}
function draw(t){const g=c.createLinearGradient(0,0,0,540);g.addColorStop(0,'#243455');g.addColorStop(1,'#354465');c.fillStyle=g;c.fillRect(0,0,960,540);for(let i=0;i<33;i++)circle(30+(i*131)%920,25+(i*67)%355,i%3?1.2:2,'#7c91b0');circle(810,90,39,'#f4dfb1');circle(826,78,34,'#243455');c.fillStyle='#2c3b5b';c.beginPath();c.moveTo(0,430);c.quadraticCurveTo(130,300,290,420);c.quadraticCurveTo(460,320,625,420);c.quadraticCurveTo(800,280,960,420);c.lineTo(960,480);c.lineTo(0,480);c.fill();
 for(const p of [{x:0,y:480,w:960},...BubbleGarden.levels[game.level].platforms]){c.fillStyle='#26374e';c.fillRect(p.x,p.y,p.w,16);c.fillStyle='#79bda8';c.fillRect(p.x,p.y,p.w,5);for(let x=p.x+14;x<p.x+p.w-5;x+=26){c.strokeStyle='#79bda8';c.lineWidth=2;c.beginPath();c.moveTo(x,p.y);c.lineTo(x-4,p.y-7);c.moveTo(x,p.y);c.lineTo(x+4,p.y-5);c.stroke();}}
 c.fillStyle='#a3b4c8';c.font='12px system-ui';c.fillText(BubbleGarden.levels[game.level].name,25,518);c.textAlign='right';c.fillText('가둔 방울 가까이에서 X',935,518);c.textAlign='left';
 for(const e of game.enemies){if(e.state==='gone')continue;enemy(e);if(e.state==='trapped'){bubble(e.x,e.y,28);c.fillStyle=e.timer<2?'#ffb4c6':'#defff0';c.font='bold 14px system-ui';c.textAlign='center';c.fillText(Math.ceil(e.timer)+'s',e.x,e.y-36);c.textAlign='left';}}
 for(const b of game.bubbles)bubble(b.x,b.y,19,Math.min(1,(3-b.age)*2));
 const p=game.player;c.save();c.globalAlpha=p.invuln>0&&Math.floor(t/100)%2?.35:1;circle(p.x,p.y,20,'#c0efda');circle(p.x-9,p.y+16,6,'#89bea9');circle(p.x+9,p.y+16,6,'#89bea9');circle(p.x-6+p.face*3,p.y-3,2.5,'#254c49');circle(p.x+6+p.face*3,p.y-3,2.5,'#254c49');circle(p.x+p.face*12,p.y+5,3,'#f3adc2');c.fillStyle='#f3adc2';c.fillRect(p.x-16,p.y-22,32,5);c.restore();
 for(const f of game.effects){for(let i=0;i<8;i++){const a=i*Math.PI/4;circle(f.x+Math.cos(a)*f.age*100,f.y+Math.sin(a)*f.age*100,4*(1-f.age/.6),'#ffe3b3');}}
 if(game.paused||game.phase!=='playing'){c.fillStyle='rgba(19,29,50,.85)';c.fillRect(235,172,490,142);c.textAlign='center';c.fillStyle='#e7f4e9';c.font='bold 29px system-ui';c.fillText(game.paused?'잠깐 쉬어가기':game.phase==='won'?'정원이 조용해졌어요':'한 번 더 해볼까요?',480,225);c.fillStyle='#b4c6d4';c.font='15px system-ui';c.fillText(game.paused?'이어하기 버튼으로 계속':game.phase==='won'?`터뜨린 방울 ${game.popped}개 · ${game.score}점`:'이 판 다시 버튼으로 재도전',480,265);c.textAlign='left';}}
function frame(t){if(!last)last=t;acc+=Math.min(t-last,50)/1000;last=t;while(acc>=BubbleGarden.DT){clock+=BubbleGarden.DT;game.step({left:keys.left||clock<walkUntil.left,right:keys.right||clock<walkUntil.right});acc-=BubbleGarden.DT;}sync();draw(t);requestAnimationFrame(frame);}sync();requestAnimationFrame(frame);

</script></body></html>
