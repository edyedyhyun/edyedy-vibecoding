<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>당겨봐! · POCKET SLING</title><style>
:root{color-scheme:light;--ink:#193c39;--muted:#627770;--orange:#ed7043;--paper:#f7f3e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,sans-serif}main{max-width:1140px;margin:auto;padding:24px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:var(--muted)}h1{font-size:32px;line-height:1.2;margin:4px 0}header p{margin:0;color:var(--muted);font-size:13px}.badge{border:1px solid #cad4c8;border-radius:30px;padding:8px 15px;font-size:12px}.panel{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}.stats{display:flex;gap:24px}.stats span{font-size:12px;color:var(--muted)}.stats strong{display:block;font-size:19px;color:var(--ink)}button{font:inherit;cursor:pointer;border:1px solid #c4cfc3;border-radius:10px;padding:9px 15px;background:#fffdf6;color:var(--ink);font-weight:700}button:disabled{opacity:.4;cursor:default}button.primary{background:var(--ink);color:white;border-color:var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.stage{width:min(100%, max(500px, calc((100vh - 330px) * 1.7857)));margin-inline:auto;display:flex;justify-content:center;position:relative;background:#e8efdf;border:1px solid #ccd8c5;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.message{min-height:26px;margin:12px 0;color:var(--ink);font-weight:650}.controls{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:26px;background:#fffcf4;border:1px solid #dfdfd0;padding:15px 20px;border-radius:14px}.controls label{font-size:13px;font-weight:700}input[type=range]{width:100%;accent-color:#ed7043;display:block;margin:9px 0 0}.guide{display:flex;gap:12px;align-items:center;white-space:nowrap}input[type=checkbox]{accent-color:#193c39;width:17px;height:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}footer{display:flex;justify-content:space-between;gap:18px;margin-top:14px;color:var(--muted);font-size:12px}footer p{margin:0;max-width:740px}.next{background:#ed7043;border-color:#ed7043;color:#fff}#next[hidden]{display:none}@media(max-width:650px){.stage{width:100%}main{padding:16px 12px}header{margin-bottom:10px}.badge{display:none}h1{font-size:26px}.stats{gap:14px}.stats strong{font-size:16px}.panel{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr;gap:12px;padding:12px}.guide{grid-column:1/-1}.message{font-size:13px}footer{display:block}footer p+ p{margin-top:8px}.actions button{padding:8px 12px;font-size:13px}}
</style></head><body><main><header><div><div class="eyebrow">POCKET SLING · A LITTLE PHYSICS PLAYGROUND</div><h1>당겨봐!</h1><p>당기는 건 한 번. 날아가는 길은 여러 가지.</p></div><span class="badge">OFFLINE HTML5 · 3 STAGES</span></header><section class="panel"><div class="stats"><span>지금 도전하는 판<strong id="level"></strong></span><span>남은 공<strong id="shots"></strong></span><span>맞힌 표적<strong id="hits"></strong></span></div><div class="actions"><button id="pause">일시정지</button><button id="retry">이 판 다시</button><button id="next" class="next" hidden>다음 판 →</button></div></section><div class="stage"><canvas id="board" width="1000" height="560" aria-label="새총 게임판. 아래 각도와 힘 조절 및 발사 버튼으로도 플레이할 수 있습니다."></canvas></div><p id="message" class="message" role="status" aria-live="polite"></p><section class="controls"><label>각도 <output id="angleValue">25°</output><input id="angle" type="range" min="5" max="75" value="25" aria-label="발사 각도"></label><label>힘 <output id="powerValue">75%</output><input id="power" type="range" min="20" max="100" value="75" aria-label="발사 힘"></label><div class="guide"><label><input id="guide" type="checkbox" checked> 예상 궤적</label><button id="launch" class="primary">공 발사 ↗</button></div></section><footer><p>주황 공을 왼쪽 아래로 당겼다 놓으세요. 또는 각도·힘을 정하고 발사하세요. Space 발사 · P 일시정지 · R 이 판 다시. 민트 표적을 모두 맞히면 성공! 점선은 첫 충돌 전의 경로입니다.</p><p>EDYEDY · VIBE CODING NOTES</p></footer></main><script src="vendor/matter.min.js"></script><script src="engine.js"></script><script src="app.js"></script></body></html>
