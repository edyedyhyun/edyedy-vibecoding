<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>길 하나 남겨두기 · Lane Escape</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#26382f;font-family:system-ui,-apple-system,sans-serif}main{width:min(920px,100%);margin:24px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#647066}h1{font-size:29px;margin:6px 0}.intro{font-size:14px;margin:8px 0 18px;color:#657064}.layout{display:grid;grid-template-columns:minmax(0,480px) 1fr;gap:24px;align-items:start}.board{position:relative;background:#203c32;border-radius:20px;overflow:hidden;box-shadow:0 16px 35px #26382f22}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 205px);object-fit:contain}.panel{border-top:2px solid #294838;padding:18px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:15px}.stat small{display:block;font-size:12px;color:#6b776e}.stat strong{display:block;font-size:25px;margin-top:5px;font-variant-numeric:tabular-nums}.message{min-height:58px;margin:24px 0 16px;line-height:1.6;font-size:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:1px solid #acb7a8;border-radius:9px;background:#faf9f4;padding:13px 7px;font:inherit;font-size:14px;color:#26382f;cursor:pointer;touch-action:manipulation}button:hover{background:#dbe9d9}button:focus-visible{outline:3px solid #dfaa3e}button:disabled{opacity:.45;cursor:default}.primary:hover{background:#3a604b}.primary{grid-column:1/-1;background:#294d3e;color:white;border-color:#294d3e}.notes{font-size:12px;line-height:1.8;color:#68756b;margin-top:20px}footer{font-size:11px;color:#788279;margin-top:16px}@media(max-width:640px){main{margin:12px auto;padding:0 12px}.layout{grid-template-columns:1fr;gap:12px}h1{font-size:22px}.intro{margin-bottom:10px;font-size:12px}canvas{max-height:49vh}.panel{padding:10px 0}.stats{grid-template-columns:repeat(4,1fr);gap:6px}.stat strong{font-size:19px}.stat small{font-size:10px}.message{margin:10px 0;min-height:22px;font-size:12px}.controls{grid-template-columns:repeat(4,1fr)}.primary{grid-column:auto}button{font-size:12px;padding:11px 2px}.notes{margin-top:10px}footer{margin-top:8px}}
</style></head><body><main><header class="head"><div><div class="eyebrow">A SMALL OFFLINE ARCADE · 25</div><h1>길 하나 남겨두기</h1></div><span class="eyebrow">LANE ESCAPE</span></header><p class="intro">앞에서 내려오는 차를 피해, 60초의 도로를 달립니다.</p><div class="layout"><div class="board"><canvas id="game" width="480" height="640" role="img" aria-label="자동차 피하기 게임판"></canvas></div><section class="panel"><div class="stats"><div class="stat"><small>주행 시간</small><strong id="time">0.0초</strong></div><div class="stat"><small>이동 거리</small><strong id="distance">0m</strong></div><div class="stat"><small>피한 차</small><strong id="passed">0대</strong></div><div class="stat"><small>최고 기록</small><strong id="best">0.0초</strong></div></div><p class="message" id="message" aria-live="polite"></p><div class="controls"><button id="start" class="primary">주행 시작</button><button id="left" aria-label="왼쪽 차선">← 왼쪽</button><button id="right" aria-label="오른쪽 차선">오른쪽 →</button><button id="pause">일시정지</button></div><div class="notes">← → 또는 A · D로 차선 변경 · P로 일시정지<br>버튼을 한 번 누르면 한 차선 이동합니다.<br>차에 부딪히면 종료됩니다. 창을 벗어나면 자동 일시정지.<br>거리는 게임 속 수치이며 실제 속도 단위가 아닙니다.</div></section></div><footer>인터넷 없이 실행 · 원작 이미지와 음원 없이 만든 작은 자동차 게임</footer></main><script>
(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.LaneEscape=factory();})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const W=480,H=640,LANES=[140,240,340],PLAYER_Y=545,CHANGE=.22,DURATION=60;
function create(seed=731){return {mode:'ready',time:0,distance:0,speed:180,lane:1,x:240,vehicles:[],passed:0,rows:0,safe:1,next:1.1,seed:seed>>>0,road:0,message:'60초 동안 세 차선 사이의 길을 찾아보세요.'};}
function random(s){s.seed=(1664525*s.seed+1013904223)>>>0;return s.seed/4294967296;}
function start(s){if(s.mode==='ready')s.mode='playing';}
function move(s,d){if(s.mode!=='playing')return false;let lane=Math.max(0,Math.min(2,s.lane+Math.sign(d)));if(lane===s.lane)return false;s.lane=lane;s.message=['왼쪽 차선','가운데 차선','오른쪽 차선'][lane];return true;}
function spawn(s){let choices=[s.safe];if(s.safe>0)choices.push(s.safe-1);if(s.safe<2)choices.push(s.safe+1);s.safe=choices[Math.floor(random(s)*choices.length)];s.rows++;let blocked=[0,1,2].filter(l=>l!==s.safe);if(s.time<12)blocked=[blocked[Math.floor(random(s)*blocked.length)]];for(const l of blocked)s.vehicles.push({lane:l,x:LANES[l],y:-60,passed:false,color:l%2?'#edb751':'#8cadc6',row:s.rows});}
function step(s,dt){if(s.mode!=='playing')return;dt=Math.max(0,Math.min(.05,dt));s.time+=dt;s.speed=180+Math.min(s.time/45,1)*160;s.distance+=s.speed*dt/10;s.road=(s.road+s.speed*dt)%80;let delta=LANES[s.lane]-s.x;s.x+=Math.sign(delta)*Math.min(Math.abs(delta),100/CHANGE*dt);s.next-=dt;if(s.next<=0){spawn(s);s.next+=1.25-.35*Math.min(s.time/45,1);}
for(const v of s.vehicles){v.y+=s.speed*dt;if(Math.abs(v.x-s.x)<43&&Math.abs(v.y-PLAYER_Y)<65){s.mode='over';s.message='차와 부딪혔습니다. 다른 길로 다시 가 볼까요?';return;}if(!v.passed&&v.y>PLAYER_Y+68){v.passed=true;s.passed++;}}
s.vehicles=s.vehicles.filter(v=>v.y<H+80);if(s.time>=DURATION){s.time=DURATION;s.mode='clear';s.message='60초 완주! 다음엔 다른 흐름의 도로를 달려보세요.';}}
return {W,H,LANES,PLAYER_Y,CHANGE,DURATION,create,start,move,spawn,step};
});

</script><script>
'use strict';
const E=LaneEscape,$=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');let run=0,state=E.create(),best=0,previous=performance.now();try{best=Number(localStorage.getItem('lane-escape-best'))||0;}catch{}
function round(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function car(x,y,color,player=false){round(x-26,y-40,52,80,10,color);round(x-19,y-24,38,21,5,player?'#263c3c':'#354653');round(x-19,y+19,38,12,4,'#263c3c');for(const dx of [-29,24]){round(x+dx,y-27,5,19,2,'#1a2724');round(x+dx,y+17,5,19,2,'#1a2724');}round(x-20,y-37,10,5,2,'#fff4b9');round(x+10,y-37,10,5,2,'#fff4b9');if(player){ctx.fillStyle='#fff0bc';ctx.fillRect(x-3,y-5,6,18);}}
function paint(){ctx.fillStyle='#315445';ctx.fillRect(0,0,480,640);ctx.fillStyle='#d4c9a4';ctx.fillRect(69,0,11,640);ctx.fillRect(400,0,11,640);ctx.fillStyle='#343e3b';ctx.fillRect(80,0,320,640);ctx.fillStyle='#b7bca6';for(let y=-80+state.road;y<640;y+=80){ctx.fillRect(187,y,5,38);ctx.fillRect(287,y,5,38);ctx.fillStyle='#72967b';ctx.fillRect(28,y,16,30);ctx.fillRect(436,y+24,16,30);ctx.fillStyle='#b7bca6';}for(const v of state.vehicles)car(v.x,v.y,v.color);car(state.x,E.PLAYER_Y,'#f07746',true);ctx.font='12px system-ui';ctx.fillStyle='#e5e5ce';ctx.textAlign='left';ctx.fillText('60 SECOND ROAD',99,29);ctx.textAlign='right';ctx.fillText(Math.round(state.speed)+' px/s',380,29);round(100,44,280,4,2,'#626e62');round(100,44,280*Math.min(state.time/60,1),4,2,'#f4c55d');
if(state.mode!=='playing'){round(96,225,288,144,12,'#f7f3e8f2');ctx.textAlign='center';ctx.fillStyle='#284438';ctx.font='bold 25px system-ui';ctx.fillText({ready:'길 하나 남겨두기',paused:'잠깐 멈춤',over:'다시 출발할까요?',clear:'60초 완주'}[state.mode],240,271);ctx.font='14px system-ui';ctx.fillText(state.mode==='ready'?'← →로 차선을 바꿔 보세요':state.time.toFixed(1)+'초 · '+state.passed+'대 피함',240,303);ctx.fillText(state.mode==='paused'?'P 또는 계속 주행 버튼':state.mode==='playing'?'':'아래 버튼에서 출발',240,334);}
$('time').textContent=state.time.toFixed(1)+'초';$('distance').textContent=Math.floor(state.distance)+'m';$('passed').textContent=state.passed+'대';$('best').textContent=best.toFixed(1)+'초';$('message').textContent=state.message; $('start').textContent=['over','clear'].includes(state.mode)?'다시 출발':state.mode==='ready'?'주행 시작':'처음부터';$('pause').textContent=state.mode==='paused'?'계속 주행':'일시정지';$('pause').disabled=!['playing','paused'].includes(state.mode);$('left').disabled=$('right').disabled=state.mode!=='playing';canvas.setAttribute('aria-label',`자동차 게임, 상태 ${state.mode}, ${state.time.toFixed(1)}초, ${Math.floor(state.distance)}m, 피한 차 ${state.passed}대, 차선 ${state.lane+1}, 속도 ${Math.round(state.speed)}픽셀/초, 차량 `+state.vehicles.map(v=>`${v.lane+1}차선 y${Math.round(v.y)}`).join('; '));}
function pause(){if(state.mode==='playing'){state.mode='paused';state.message='멈춘 동안 차량과 시간도 정지합니다.';}else if(state.mode==='paused'){state.mode='playing';state.message='다시 주행합니다.';}paint();}
$('start').onclick=()=>{state=E.create(731+run++*997);E.start(state);paint();};$('left').onclick=()=>{E.move(state,-1);paint();};$('right').onclick=()=>{E.move(state,1);paint();};$('pause').onclick=pause;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D','p','P'].includes(e.key)){e.preventDefault();if(e.repeat)return;if(['p','P'].includes(e.key))pause();else E.move(state,['ArrowLeft','a','A'].includes(e.key)?-1:1);}});window.addEventListener('blur',()=>{if(state.mode==='playing')pause();});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='playing')pause();});
function tick(now){const dt=Math.min((now-previous)/1000,.05);previous=now;const before=state.mode;E.step(state,dt);if(before==='playing'&&['over','clear'].includes(state.mode)&&state.time>best){best=state.time;try{localStorage.setItem('lane-escape-best',String(best));}catch{}}paint();requestAnimationFrame(tick);}paint();requestAnimationFrame(tick);

</script></body></html>
