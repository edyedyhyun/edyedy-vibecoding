<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>톡! 나누기 · Split Pop</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f4eee7;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:26px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.kicker{font-size:11px;letter-spacing:3px;color:#c4b5fd;font-weight:700}h1{font-size:35px;margin:5px 0}header p{font-size:13px;color:#b7bfce;margin:0}.badge{border:1px solid #47516a;padding:9px 14px;border-radius:30px;font-size:12px;color:#cabef5}.stats{display:flex;justify-content:space-between;background:#202a40;padding:12px 18px;border-radius:14px 14px 0 0;gap:8px;font-size:12px;color:#aebad2}.stats b{font-size:20px;color:#fff;margin-left:8px}canvas{display:block;width:100%;aspect-ratio:800/440;background:#202b43;border:1px solid #3b4660;border-top:0;border-radius:0 0 14px 14px;outline:none}canvas:focus-visible{outline:2px solid #f4c779}#status{min-height:24px;font-size:14px;color:#ddcef7;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions,.controls{display:flex;gap:8px}button{font:inherit;cursor:pointer;color:#eee7fb;background:#303a51;border:1px solid #59617b;padding:12px 17px;border-radius:10px;touch-action:none}button:hover{background:#424b65}button:disabled{opacity:.4;cursor:default}.primary{background:#e5b774;color:#1c2232;border-color:#e5b774;font-weight:700}.primary:hover{background:#f7ca8a}.controls button{min-width:66px}.controls #shoot{min-width:128px;background:#7863a4}footer{margin-top:17px;border-top:1px solid #354158;padding-top:12px;color:#a9b4c6;font-size:12px;line-height:1.8}kbd{font:inherit;color:#f2d192} @media(max-width:600px){main{padding:18px 12px}h1{font-size:28px}.badge{display:none}.stats{padding:10px;font-size:11px}.stats b{font-size:17px;margin-left:4px}.row{justify-content:center}.actions,.controls{width:100%;justify-content:center}button{padding:11px 14px}.controls button{flex:1}.controls #shoot{flex:2}#status{min-height:44px;font-size:13px}}
</style></head><body><main><header><div><div class="kicker">SMALL ARCADE / 22</div><h1>톡! 나누기</h1><p>큰 공 하나가, 작은 공 둘이 되는 순간.</p></div><span class="badge">SPLIT POP · OFFLINE</span></header><div class="stats"><span>라운드<b id="round">1 / 3</b></span><span>점수<b id="score">0</b></span><span>남은 공<b id="balls">1</b></span><span>기회<b id="lives">3</b></span></div><canvas id="game" width="800" height="440" tabindex="0" aria-label="공 나누기 게임판. 좌우 방향키 이동, 스페이스 발사"></canvas><p id="status" role="status" aria-live="polite"></p><div class="row"><div class="actions"><button id="start" class="primary">시작</button><button id="pause" disabled>일시정지</button><button id="restart">처음부터</button></div><div class="controls"><button id="left" aria-label="왼쪽 이동">←</button><button id="shoot">발사 · SPACE</button><button id="right" aria-label="오른쪽 이동">→</button></div></div><footer><kbd>← → / A D</kbd> 이동 · <kbd>SPACE</kbd> 발사 · <kbd>P</kbd> 일시정지<br>큰 공 → 중간 공 2개 → 작은 공 4개. 작은 공은 맞히면 사라집니다.<br>세 라운드 동안 기회 3번. 피격 후 잠시 보호됩니다. 화면 버튼을 길게 눌러 이동·연속 발사할 수 있습니다.</footer></main><script>
(function(root){'use strict';
const W=800,H=440,FLOOR=392,R=[13,24,42],SPEED=[145,112,84],BOUNCE=[220,310,395];
function ball(x,y,size,vx){return{x,y,size,r:R[size],vx:vx??SPEED[size],vy:0};}
function create(stage=0,score=0,lives=3){const sets=[[ball(400,100,2,84)],[ball(215,100,2,84),ball(600,170,1,-112)],[ball(160,100,2,84),ball(640,100,2,-84)]];return{stage,score,lives,balls:sets[stage],player:{x:400,y:FLOOR-17,r:13},shots:[],cooldown:0,invincible:1.5,time:0,status:'ready',hits:0};}
function start(s){if(s.status==='ready')s.status='playing';}
function fire(s){if(s.status!=='playing'||s.cooldown>0||s.shots.length>=2)return false;s.shots.push({x:s.player.x,top:FLOOR-32,bottom:FLOOR-4,age:0});s.cooldown=.28;return true;}
function split(s,index){const b=s.balls[index];s.balls.splice(index,1);s.score+=(3-b.size)*100;s.hits++;if(b.size){let z=b.size-1;for(let d of[-1,1]){let n=ball(Math.max(R[z],Math.min(W-R[z],b.x+d*R[z]*.55)),Math.min(FLOOR-R[z],b.y),z,d*SPEED[z]);n.vy=-BOUNCE[z]*.8;s.balls.push(n);}}if(!s.balls.length)s.status='clear';}
function shotHit(q,b){let y=Math.max(q.top,Math.min(q.bottom,b.y));return (q.x-b.x)**2+(y-b.y)**2<=b.r*b.r;}
function step(s,dt,input={}){if(s.status!=='playing')return;dt=Math.max(0,Math.min(dt,.05));s.time+=dt;s.cooldown=Math.max(0,s.cooldown-dt);s.invincible=Math.max(0,s.invincible-dt);s.player.x=Math.max(18,Math.min(W-18,s.player.x+(Number(!!input.right)-Number(!!input.left))*250*dt));if(input.fire)fire(s);
for(const b of s.balls){b.vy+=600*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y>=FLOOR-b.r){b.y=FLOOR-b.r;b.vy=-BOUNCE[b.size]}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}}
for(let i=s.shots.length-1;i>=0;i--){let q=s.shots[i];q.top=Math.max(12,q.top-620*dt);q.age+=dt;let idx=s.balls.findIndex(b=>shotHit(q,b));if(idx>=0){s.shots.splice(i,1);split(s,idx);}else if(q.age>.95)s.shots.splice(i,1);}
if(s.status!=='playing')return;
if(s.invincible===0&&s.balls.some(b=>(b.x-s.player.x)**2+(b.y-s.player.y)**2<(b.r+s.player.r)**2)){s.lives--;s.invincible=1.8;s.shots=[];if(s.lives<=0)s.status='over';}
}
const api={W,H,FLOOR,R,SPEED,BOUNCE,ball,create,start,fire,split,shotHit,step};if(typeof module!=='undefined')module.exports=api;else root.SplitPop=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
'use strict';const E=SplitPop,$=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d');let s=E.create(),held={},last=0,acc=0,notice='';
function sync(){ $('round').textContent=`${s.stage+1} / 3`;$('score').textContent=s.score;$('balls').textContent=s.balls.length;$('lives').textContent=s.lives;$('start').hidden=!['ready','clear'].includes(s.status)||s.status==='clear'&&s.stage===2;$('start').textContent=s.status==='clear'?'다음 라운드 →':'시작';$('pause').disabled=!['playing','paused'].includes(s.status);$('pause').textContent=s.status==='paused'?'계속':'일시정지';let msg={ready:'서두르지 말고 공이 지나갈 길을 보세요. 시작을 누르면 움직입니다.',playing:'공을 나누면 개수가 늘어납니다. 낮게 튀는 작은 공을 조심하세요.',paused:'잠깐 멈췄습니다. 계속을 누르면 이어집니다.',clear:s.stage===2?'세 라운드 완료! 모든 공을 정리했습니다.':'이번 라운드 완료! 준비되면 다음 라운드로 넘어가세요.',over:'기회를 모두 썼습니다. 처음부터 다시 도전해 보세요.'}[s.status];if(msg!==notice){notice=msg;$('status').textContent=msg;}c.setAttribute('aria-label',`라운드 ${s.stage+1}, 점수 ${s.score}, 남은 공 ${s.balls.length}, 기회 ${s.lives}. ${msg}`);}
function draw(){g.clearRect(0,0,800,440);let bg=g.createLinearGradient(0,0,0,440);bg.addColorStop(0,'#25334f');bg.addColorStop(1,'#162039');g.fillStyle=bg;g.fillRect(0,0,800,440);g.strokeStyle='#ffffff08';for(let x=0;x<800;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,E.FLOOR);g.stroke()}for(let y=32;y<E.FLOOR;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(800,y);g.stroke()}g.fillStyle='#394960';g.fillRect(0,E.FLOOR,800,48);g.fillStyle='#d0ae77';g.fillRect(0,E.FLOOR,800,3);
for(let q of s.shots){g.strokeStyle='#ffe5a3';g.lineWidth=4;g.beginPath();g.moveTo(q.x,q.bottom);g.lineTo(q.x,q.top);g.stroke();g.fillStyle='#fff2cc';g.beginPath();g.moveTo(q.x,q.top-7);g.lineTo(q.x-7,q.top+7);g.lineTo(q.x+7,q.top+7);g.fill()}
for(let b of s.balls){g.fillStyle=['#8cd8bd','#ba9de8','#ed957d'][b.size];g.shadowColor=g.fillStyle;g.shadowBlur=9;g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.strokeStyle='#ffffff80';g.lineWidth=2;g.stroke();g.fillStyle='#ffffff66';g.beginPath();g.ellipse(b.x-b.r*.3,b.y-b.r*.32,b.r*.25,b.r*.15,-.5,0,Math.PI*2);g.fill();}
let p=s.player;g.globalAlpha=s.invincible>0&&Math.floor(s.time*8)%2===0?.55:1;g.fillStyle='#e4c79e';g.beginPath();g.roundRect(p.x-13,E.FLOOR-27,26,25,5);g.fill();g.fillStyle='#eee4cb';g.beginPath();g.arc(p.x,E.FLOOR-32,12,0,Math.PI*2);g.fill();g.fillStyle='#ef927d';g.fillRect(p.x-14,E.FLOOR-42,28,7);g.fillStyle='#17283e';g.fillRect(p.x-6,E.FLOOR-33,3,3);g.fillRect(p.x+3,E.FLOOR-33,3,3);g.globalAlpha=1;
if(s.status!=='playing'){g.fillStyle='#1118279e';g.fillRect(0,0,800,440);g.textAlign='center';g.fillStyle='#fff0d9';g.font='bold 32px system-ui';g.fillText({ready:'한 번 맞히면, 둘로!',paused:'잠깐 쉬어가기',clear:s.stage===2?'모두 나눴어요!':'라운드 클리어',over:'다시 한 판?'}[s.status],400,193);g.font='16px system-ui';g.fillStyle='#c8d1e4';g.fillText(s.status==='paused'?`남은 공 ${s.balls.length}개 · 점수 ${s.score}`:'좌우로 피하고, 위로 쏘세요.',400,230);}}
function frame(t){let dt=last?Math.min((t-last)/1000,.1):0;last=t;if(s.status==='playing'){acc+=dt;while(acc>=1/120){E.step(s,1/120,held);acc-=1/120;}}else acc=0;sync();draw();requestAnimationFrame(frame)}
function pause(){if(s.status==='playing'){s.status='paused';held={}}else if(s.status==='paused')s.status='playing';sync();draw()}
$('start').onclick=()=>{if(s.status==='clear')s=E.create(s.stage+1,s.score,s.lives);E.start(s);held={};sync()};$('pause').onclick=pause;$('restart').onclick=()=>{s=E.create();held={};sync();draw()};
for(let[id,k]of[['left','left'],['right','right'],['shoot','fire']]){let b=$(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held[k]=true;if(k==='fire')E.fire(s)};for(let ev of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held[k]=false);b.onclick=e=>{if(e.detail===0&&k==='fire')E.fire(s)};}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'fire'};if(map[e.key]){e.preventDefault();held[map[e.key]]=true;if(e.key===' ')E.fire(s)}if(e.key.toLowerCase()==='p'&&!e.repeat){e.preventDefault();pause()}});document.addEventListener('keyup',e=>{const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',' ':'fire'};if(map[e.key])held[map[e.key]]=false});window.addEventListener('blur',()=>{held={};if(s.status==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){held={};if(s.status==='playing')pause()}});sync();requestAnimationFrame(frame);

</script></body></html>
