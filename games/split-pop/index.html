<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>톡! 나누기 · Split Pop</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f4eee7;font-family:system-ui,-apple-system,sans-serif}main{max-width:1000px;margin:auto;padding:26px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.kicker{font-size:11px;letter-spacing:3px;color:#c4b5fd;font-weight:700}h1{font-size:35px;margin:5px 0}header p{font-size:13px;color:#b7bfce;margin:0}.badge{border:1px solid #47516a;padding:9px 14px;border-radius:30px;font-size:12px;color:#cabef5}.stats{display:flex;justify-content:space-between;background:#202a40;padding:12px 18px;border-radius:14px 14px 0 0;gap:8px;font-size:12px;color:#aebad2}.stats b{font-size:20px;color:#fff;margin-left:8px}canvas{display:block;width:100%;aspect-ratio:800/440;background:#202b43;border:1px solid #3b4660;border-top:0;border-radius:0 0 14px 14px;outline:none}canvas:focus-visible{outline:2px solid #f4c779}#status{min-height:24px;font-size:14px;color:#ddcef7;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions,.controls{display:flex;gap:8px}button{font:inherit;cursor:pointer;color:#eee7fb;background:#303a51;border:1px solid #59617b;padding:12px 17px;border-radius:10px;touch-action:none}button:hover{background:#424b65}button:disabled{opacity:.4;cursor:default}.primary{background:#e5b774;color:#1c2232;border-color:#e5b774;font-weight:700}.primary:hover{background:#f7ca8a}.controls button{min-width:66px}.controls #shoot{min-width:128px;background:#7863a4}footer{margin-top:17px;border-top:1px solid #354158;padding-top:12px;color:#a9b4c6;font-size:12px;line-height:1.8}kbd{font:inherit;color:#f2d192} @media(max-width:600px){main{padding:18px 12px}h1{font-size:28px}.badge{display:none}.stats{padding:10px;font-size:11px}.stats b{font-size:17px;margin-left:4px}.row{justify-content:center}.actions,.controls{width:100%;justify-content:center}button{padding:11px 14px}.controls button{flex:1}.controls #shoot{flex:2}#status{ </style></head><body><main><header><div><div class="kicker">SMALL ARCADE / 22</div><h1>톡! 나누기</h1><p>큰 공 하나가, 작은 공 둘이 되는 순간.</p></div><span class="badge">SPLIT POP · OFFLINE</span></header><div class="stats"><span>라운드<b id="round">1 / 3</b></span><span>점수<b id="score">0</b></span><span>남은 공<b id="balls">1</b></span><span>기회<b id="lives">3</b></span></div><canvas id="game" width="800" height="440" tabindex="0" aria-label="공 나누기 게임판. 좌우 방향키 이동, 스페이스 발사"></canvas><p id="status" role="status" aria-live="polite"></p><div class="row"><div class="actions"><button id="start" class="primary">시작</button><button id="pause" disabled>일시정지</button><button id="restart">처음부터</button></div><div class="controls"><button id="left" aria-label="왼쪽 이동">←</button><button id="shoot">발사 · SPACE</button><button id="right" aria-label="오른쪽 이동">→</button></div></div><footer><kbd>← → / A D</kbd> 이동 · <kbd>SPACE</kbd> 발사 · <kbd>P</kbd> 일시정지<br>큰 공 → 중간 공 2개 → 작은 공 4개. 작은 공은 맞히면 사라집니다.<br>세 라운드 동안 기회 3번. 피격 후 잠시 보호됩니다. 화면 버튼을 길게 눌러 이동·연속 발사할 수 있습니다.</footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
