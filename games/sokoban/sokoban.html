<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 창고 · Sokoban</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f0e7;color:#153e38;font-family:system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:30px 24px}header{display:flex;justify-content:space-between;gap:16px;align-items:end;border-bottom:1px solid #b9c8b9;padding-bottom:20px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700}h1{font-size:38px;margin:8px 0}header p{margin:0;font-size:14px;color:#59736b}.badge{border:1px solid #a6b9aa;padding:9px 14px;border-radius:20px;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:26px;margin-top:24px}.board-wrap{background:#163f38;border-radius:18px;padding:18px;box-shadow:0 12px 25px #173c3415}canvas{display:block;width:min(100%,calc(100vh - 280px));margin:auto;aspect-ratio:8/7;outline:none;border-radius:8px}canvas:focus-visible{outline:3px solid #efbc66;outline-offset:3px}.stats{display:flex;gap:22px;color:#d8e8d5;padding:0 4px 14px;font-size:13px}.stats b{font-size:21px;color:#fff;margin-left:7px}aside{padding-top:4px}label{font-size:13px;font-weight:700}select,button{font:inherit;border:1px solid #9bad9a;border-radius:9px;background:#fffdf6;color:#153e38;padding:12px;cursor:pointer}select{width:100%;margin:9px 0 18px}button:hover{background:#e3ebdc}button:disabled{opacity:.4;cursor:default}.actions{display:grid;gap:8px}.primary{background:#174c40;color:white}.primary:hover{background:#286451}#message{min-height:85px;line-height:1.65;font-size:14px;background:#e7e9d9;padding:15px;border-radius:9px;margin:18px 0}.legend{font-size:13px;line-height:1.9;color:#4a6358}.keys{display:grid;grid-template-columns:repeat(3,50px);justify-content:center;gap:7px;margin:18px 0}.keys button{font-size:21px;padding:9px;touch-action:manipulation}.keys .up{grid-column:2}.keys .left{grid-column:1}.foot{font-size:12px;color:#687e70;border-top:1px solid #c7cec0;padding-top:14px;line-height:1.7}footer{margin-top:20px;color:#667c70;font-size:12px} @media(max-width:650px){canvas{width:100%}main{padding:18px 14px}header{align-items:start}h1{font-size:29px}.badge{display:none}.layout{grid-template-columns:1fr;gap:14px;margin-top:16px}.board-wrap{padding:12px}aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}aside>div:first-child{grid-column:1/-1}select{margin-bottom:0}.actions{align-content:start}#message{margin:0;min-height:90px}.keys{margin:0}.legend{font-size:12px}.foot{grid-column:1/-1}.stats{padding-bottom:8px}footer{margin-top:10px}}
</style></head><body><main><header><div><div class="eyebrow">A LITTLE PUZZLE / 21</div><h1>작은 창고</h1><p>당길 수 없으니, 밀기 전에 한 번 더.</p></div><span class="badge">SOKOBAN · OFFLINE</span></header><section class="layout"><div class="board-wrap"><div class="stats"><span>이동<b id="moves">0</b></span><span>밀기<b id="pushes">0</b></span><span>도착<b id="goals">0 / 1</b></span></div><canvas id="board" width="800" height="700" tabindex="0" aria-label="상자 밀기 게임판. 방향키 또는 화면 버튼으로 이동하세요."></canvas></div><aside><div><label for="level">오늘 정리할 창고</label><select id="level"></select></div><div class="actions"><button id="undo">한 수 되돌리기 · Z</button><button id="restart">이 판 다시 시작 · R</button><button id="next" class="primary" hidden>다음 창고 →</button></div><p id="message" role="status" aria-live="polite"></p><div class="keys" aria-label="이동 버튼"><button class="up" data-dir="0,-1" aria-label="위로">↑</button><button class="left" data-dir="-1,0" aria-label="왼쪽으로">←</button><button data-dir="0,1" aria-label="아래로">↓</button><button data-dir="1,0" aria-label="오른쪽으로">→</button></div><div class="legend">● 작은 작업자<br>▧ 나무 상자 → 초록 점 자리<br>방향키 / WASD 이동</div><div class="foot">상자는 한 번에 하나만 밀 수 있습니다.<br>당기기는 없지만, 되돌리기는 무제한입니다.<br>모든 상자를 초록 자리에 놓으면 완료!</div></aside></section><footer>설치 없이 한 파일 · 5개의 작은 퍼즐 · 기록은 현재 실행 중에만 유지됩니다.</footer></main><script>
(function(root){
'use strict';
const levels=[
 {name:'한 걸음 뒤에서',map:['#######','#     #','#  .  #','#  $  #','#  @  #','#     #','#######']},
 {name:'돌아가는 길',map:['########','#      #','# .  . #','# $  $ #','#   @  #','#      #','########']},
 {name:'좁은 창고',map:['########','#  .   #','#  $   #','# # #  #','# $@ . #','#      #','########']},
 {name:'자리 바꾸기',map:['########','# .  . #','#  $$  #','#  #   #','#  @   #','#      #','########']},
 {name:'세 개의 짐',map:['########','# . . .#','# $ $ $#','#      #','#  @   #','#      #','########']}
];
const key=(x,y)=>`${x},${y}`;
function create(map){const s={width:map[0].length,height:map.length,walls:[],goals:[],boxes:[],player:null,moves:0,pushes:0,history:[]};map.forEach((row,y)=>{if(row.length!==s.width)throw Error('Uneven map');[...row].forEach((c,x)=>{let p=key(x,y);if(c==='#')s.walls.push(p);if('.+*'.includes(c))s.goals.push(p);if('$*'.includes(c))s.boxes.push(p);if('@+'.includes(c)){if(s.player)throw Error('Multiple players');s.player=p;}})});if(!s.player||s.boxes.length!==s.goals.length||!s.boxes.length)throw Error('Invalid map');return s;}
const has=(a,x,y)=>a.includes(key(x,y));
function wall(s,x,y){return x<0||y<0||x>=s.width||y>=s.height||has(s.walls,x,y);}
function won(s){return s.boxes.every(p=>s.goals.includes(p));}
function move(s,dx,dy){if(Math.abs(dx)+Math.abs(dy)!==1||won(s))return false;let [x,y]=s.player.split(',').map(Number),nx=x+dx,ny=y+dy;if(wall(s,nx,ny))return false;let box=s.boxes.indexOf(key(nx,ny));if(box>=0&&(wall(s,nx+dx,ny+dy)||has(s.boxes,nx+dx,ny+dy)))return false;s.history.push({player:s.player,boxes:[...s.boxes],moves:s.moves,pushes:s.pushes});if(box>=0){s.boxes[box]=key(nx+dx,ny+dy);s.pushes++;}s.player=key(nx,ny);s.moves++;return true;}
function undo(s){const prev=s.history.pop();if(!prev)return false;Object.assign(s,prev);return true;}
function corners(s){return s.boxes.filter(p=>{if(s.goals.includes(p))return false;let[x,y]=p.split(',').map(Number);return (wall(s,x-1,y)||wall(s,x+1,y))&&(wall(s,x,y-1)||wall(s,x,y+1));});}
const api={levels,create,move,undo,won,corners};if(typeof module!=='undefined')module.exports=api;else root.Sokoban=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
'use strict';
const E=Sokoban,$=id=>document.getElementById(id),canvas=$('board'),ctx=canvas.getContext('2d');let level=0,state;
E.levels.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`0${i+1} / ${l.name}`;$('level').append(o)});
function start(i){level=i;state=E.create(E.levels[i].map);$('level').value=i;render();}
function tile(x,y,size,fill,inset=2){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x*size+inset,y*size+inset,size-inset*2,size-inset*2,7);ctx.fill();}
function render(){const size=80;canvas.width=state.width*size;canvas.height=state.height*size;canvas.style.aspectRatio=`${state.width}/${state.height}`;ctx.fillStyle='#163f38';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<state.height;y++)for(let x=0;x<state.width;x++){const p=`${x},${y}`;tile(x,y,size,state.walls.includes(p)?'#36574b':'#dce1c8');if(state.walls.includes(p)){ctx.fillStyle='#456657';ctx.fillRect(x*size+10,y*size+11,size-20,4);}if(state.goals.includes(p)){ctx.strokeStyle='#4f937a';ctx.lineWidth=4;ctx.beginPath();ctx.arc(x*size+40,y*size+40,18,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#78ab8c';ctx.beginPath();ctx.arc(x*size+40,y*size+40,6,0,Math.PI*2);ctx.fill();}}
const trapped=E.corners(state);state.boxes.forEach(p=>{let[x,y]=p.split(',').map(Number);tile(x,y,size,state.goals.includes(p)?'#5a997b':'#dba855',12);ctx.strokeStyle=state.goals.includes(p)?'#c8e3be':'#9c7037';ctx.lineWidth=5;ctx.strokeRect(x*size+21,y*size+21,38,38);ctx.beginPath();ctx.moveTo(x*size+22,y*size+22);ctx.lineTo(x*size+58,y*size+58);ctx.stroke();if(trapped.includes(p)){ctx.strokeStyle='#be533a';ctx.lineWidth=5;ctx.strokeRect(x*size+9,y*size+9,62,62);}});let[px,py]=state.player.split(',').map(Number);ctx.fillStyle='#233f3a33';ctx.beginPath();ctx.ellipse(px*80+40,py*80+55,24,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef7950';ctx.beginPath();ctx.arc(px*80+40,py*80+39,23,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3d3';ctx.beginPath();ctx.arc(px*80+40,py*80+32,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#173f38';ctx.fillRect(px*80+33,py*80+30,4,4);ctx.fillRect(px*80+43,py*80+30,4,4);
$('moves').textContent=state.moves;$('pushes').textContent=state.pushes;$('goals').textContent=`${state.boxes.filter(p=>state.goals.includes(p)).length} / ${state.goals.length}`;$('undo').disabled=!state.history.length;$('next').hidden=!E.won(state)||level===E.levels.length-1;$('message').textContent=E.won(state)?(level===E.levels.length-1?'마지막 창고까지 정리 끝! 다른 길로 더 적게 움직여 보세요.':'정리 끝! 다음 창고로 가거나 한 수 되돌려 볼 수 있어요.'):trapped.length?'상자가 구석에 갇혔어요. Z 또는 ‘한 수 되돌리기’로 돌아가세요.':'초록 점 위로 상자를 밀어 주세요. 옆이나 뒤로 돌아가는 길도 살펴보세요.';canvas.setAttribute('aria-label',`창고 ${level+1}. 이동 ${state.moves}, 밀기 ${state.pushes}, 도착 ${$('goals').textContent}. ${$('message').textContent}`);}
function step(dx,dy){E.move(state,dx,dy);render();}
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>step(...b.dataset.dir.split(',').map(Number)));$('undo').onclick=()=>{E.undo(state);render()};$('restart').onclick=()=>start(level);$('next').onclick=()=>start(Math.min(level+1,E.levels.length-1));$('level').onchange=e=>start(Number(e.target.value));document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase(),dirs={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(dirs[k]){e.preventDefault();step(...dirs[k]);}else if(k==='z'){e.preventDefault();E.undo(state);render();}else if(k==='r'){e.preventDefault();start(level);}});start(0);

</script></body></html>
