<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>구름길 · Cloud Trail</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e5;color:#223e45;font-family:system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:22px 28px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:800;color:#698d86}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:32px;margin:5px 0}header p{margin:0;color:#627877;font-size:14px}.badge{border:1px solid #cbd3c8;border-radius:30px;padding:12px 18px;font-size:11px}.top{display:flex;align-items:center;gap:25px;flex-wrap:wrap;margin-bottom:15px}.stat small{display:block;color:#688078;font-size:11px}.stat strong{display:block;font-size:20px}.tools{margin-left:auto;display:flex;gap:8px}button{font:inherit;background:#fcfaf3;color:#23474a;border:1px solid #bccbc3;border-radius:12px;padding:11px 16px;cursor:pointer;touch-action:none}button:hover{background:#dfede2}button:focus-visible{outline:3px solid #e3ab6e;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.board{width:min(100%,max(550px,calc((100vh - 310px)*2)));margin:auto}canvas{width:100%;display:block;aspect-ratio:2;border-radius:22px;border:1px solid #a7c5b5;box-shadow:0 8px 25px #56786c15}.status{min-height:26px;font-size:14px;margin:14px 0}.controls{display:flex;gap:10px;align-items:center;padding:12px;background:#e3eade;border-radius:16px}.controls button{min-width:74px;font-weight:700}.jump{margin-left:auto;background:#efba80}.hint{font-size:11px;color:#6d847b;margin:12px 0 0;line-height:1.7}.label{display:flex;gap:12px;justify-content:space-between;font-size:10px;margin-top:5px;color:#748c83}.profile{color:#a96d37;font-weight:700}@media(max-width:650px){main{padding:18px 12px}h1{font-size:28px}.badge{display:none}header{margin-bottom:15px}.top{gap:17px}.tools{margin-left:0}.board{width:100%}.controls{padding:10px;gap:8px}.controls button{min-width:60px;padding:12px}.status{font-size:13px}.stat strong{font-size:18px}}
</style></head><body><main><header><div><div class="eyebrow">CLOUD TRAIL · A SMALL PLATFORM WALK</div><h1>구름길</h1><p>한 걸음, 한 번의 점프, 작은 도착.</p></div><span class="badge">OFFLINE HTML5 · ONE SHORT TRAIL</span></header><div class="top"><div class="stat"><small>별</small><strong id="coins">0 / 3</strong></div><div class="stat"><small>다시 출발</small><strong id="deaths">0</strong></div><div class="stat"><small>체크포인트</small><strong id="checkpoint">출발점</strong></div><div class="tools"><button id="pause">일시정지</button><button id="reset">처음부터</button></div></div><div class="board"><canvas id="board" width="960" height="480" role="img" aria-label="구름길 게임 화면. 좌우로 이동하고 점프하며 발판과 구덩이를 넘어 깃발에 도착합니다."></canvas></div><p id="status" class="status" role="status"></p><div class="controls"><button id="left" aria-label="왼쪽 이동">←</button><button id="right" aria-label="오른쪽 이동">→</button><button id="jump" class="jump">점프 ↑</button></div><p class="hint">← → 이동 · ↑ / Space 점프 · P 정지. 화면 화살표는 누르고 있는 동안 이동하며 짧게 누르면 한 걸음 걷습니다. 별은 선택 목표입니다.</p><div class="label"><span id="physics" class="profile"></span><span>EDYEDY · VIBE CODING NOTES</span></div></main><script>
(function(root){'use strict';
const W=960,H=480,DT=1/120;
const solids=[{x:0,y:420,w:620,h:60},{x:710,y:420,w:940,h:60},{x:270,y:324,w:130,h:96},{x:430,y:268,w:150,h:20},{x:1040,y:330,w:140,h:20},{x:1220,y:280,w:120,h:20}];
const profiles={prototype:{speed:220,jump:520,gravity:1800,coyote:0,buffer:0},tuned:{speed:220,jump:610,gravity:1700,coyote:.09,buffer:.12}};
class Game{
 constructor(profile='tuned'){this.profile=profile;this.config={...profiles[profile]};this.reset();}
 reset(){this.player={x:85,y:399,vx:0,vy:0,w:28,h:42,grounded:true,face:1};this.phase='playing';this.paused=false;this.deaths=0;this.elapsed=0;this.checkpoint=false;this.coins=[{x:335,y:296,taken:false},{x:500,y:240,taken:false},{x:1120,y:302,taken:false}];this.coyote=this.config.coyote;this.buffer=0;this.maxJumpRise=0;this.jumpStartY=399;this.jumps=0;this.camera=0;this.message='첫 발판을 넘어 깃발까지 가 보세요.';}
 requestJump(){if(this.paused||this.phase!=='playing')return false;if(this.player.grounded||this.coyote>0){this.doJump();return true;}this.buffer=this.config.buffer;return false;}
 doJump(){let p=this.player;p.vy=-this.config.jump;p.grounded=false;this.coyote=0;this.buffer=0;this.jumpStartY=p.y;this.maxJumpRise=0;this.jumps++;this.message='점프! 발판 끝과 착지 위치를 보세요.';}
 respawn(){this.deaths++;this.player={x:this.checkpoint?745:85,y:399,vx:0,vy:0,w:28,h:42,grounded:true,face:1};this.buffer=0;this.coyote=this.config.coyote;this.message=this.checkpoint?'중간 깃발부터 다시 출발해요.':'발을 헛디뎠어요. 시작점에서 다시!';}
 step(input={},dt=DT){if(this.paused||this.phase!=='playing')return;dt=Math.min(dt,1/30);this.elapsed+=dt;let p=this.player;const dir=(input.right?1:0)-(input.left?1:0);p.vx=dir*this.config.speed;if(dir)p.face=dir;
 this.buffer=Math.max(0,this.buffer-dt);this.coyote=Math.max(0,this.coyote-dt);if(p.grounded)this.coyote=this.config.coyote;
 p.x+=p.vx*dt;for(const s of solids){if(p.y+p.h/2>s.y+.1&&p.y-p.h/2<s.y+s.h-.1&&p.x+p.w/2>s.x&&p.x-p.w/2<s.x+s.w){if(p.vx>0)p.x=s.x-p.w/2;else if(p.vx<0)p.x=s.x+s.w+p.w/2;}}
 p.x=Math.max(p.w/2,Math.min(1635,p.x));const oldBottom=p.y+p.h/2,oldTop=p.y-p.h/2;p.vy+=this.config.gravity*dt;p.y+=p.vy*dt;p.grounded=false;
 for(const s of solids){if(p.x+p.w/2<=s.x||p.x-p.w/2>=s.x+s.w)continue;if(p.vy>=0&&oldBottom<=s.y+.1&&p.y+p.h/2>=s.y){p.y=s.y-p.h/2;p.vy=0;p.grounded=true;}else if(p.vy<0&&oldTop>=s.y+s.h-.1&&p.y-p.h/2<s.y+s.h){p.y=s.y+s.h+p.h/2;p.vy=0;}}
 this.maxJumpRise=Math.max(this.maxJumpRise,this.jumpStartY-p.y);if(p.grounded&&this.buffer>0)this.doJump();
 for(const coin of this.coins){if(!coin.taken&&Math.hypot(p.x-coin.x,p.y-coin.y)<32){coin.taken=true;this.message='별 하나! 깃발까지 계속 가 보세요.';}}
 if(!this.checkpoint&&p.x>730&&p.grounded){this.checkpoint=true;this.message='중간 깃발 저장. 떨어져도 여기서 다시!';}
 if(p.y>H+80)this.respawn();if(p.x>=1530&&p.grounded){this.phase='won';this.message='도착! 별을 모두 모으지 않아도 완주할 수 있어요.';}
 this.camera=Math.max(0,Math.min(690,p.x-350));}
}
const api={Game,solids,profiles,W,H,DT};if(typeof module==='object')module.exports=api;else root.CloudTrail=api;
})(typeof globalThis!=='undefined'?globalThis:this);

</script><script>
'use strict';
const game=new CloudTrail.Game('tuned'),$=id=>document.getElementById(id),c=$('board').getContext('2d');const held={left:false,right:false},until={left:0,right:0};let clock=0,last=0,acc=0;
function clear(){held.left=held.right=false;until.left=until.right=0;}
function sync(){$('coins').textContent=game.coins.filter(x=>x.taken).length+' / 3';$('deaths').textContent=game.deaths;$('checkpoint').textContent=game.checkpoint?'중간 깃발':'출발점';$('status').textContent=game.paused?'잠깐 쉬는 중. 이어하기로 계속하세요.':game.message;$('pause').textContent=game.paused?'이어하기':'일시정지';$('pause').disabled=game.phase==='won';for(const id of ['left','right','jump'])$(id).disabled=game.paused||game.phase==='won';$('physics').textContent=game.profile==='prototype'?'초기 점프 · 속도 520 / 중력 1800':'점프 여유 · 발판 끝 90ms / 착지 입력 120ms';}
function pause(){if(game.phase!=='playing')return;game.paused=!game.paused;clear();sync();}$('pause').onclick=pause;$('reset').onclick=()=>{game.reset();clear();sync();};$('jump').onclick=()=>{game.requestJump();sync();};
for(const id of ['left','right']){const b=$(id);let began=0;b.onpointerdown=e=>{began=performance.now();held[id]=true;b.setPointerCapture(e.pointerId);};b.onpointerup=()=>{held[id]=false;if(performance.now()-began<150)until[id]=clock+.25;};b.onpointercancel=()=>{held[id]=false;until[id]=0;};b.onclick=e=>{if(e.detail===0)until[id]=clock+.25;};}
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft')held.left=true;if(e.code==='ArrowRight')held.right=true;if(e.repeat)return;if(e.code==='ArrowUp'||e.code==='Space')game.requestJump();if(e.code==='KeyP')pause();});addEventListener('keyup',e=>{if(e.code==='ArrowLeft')held.left=false;if(e.code==='ArrowRight')held.right=false;});function blur(){clear();if(game.phase==='playing'){game.paused=true;sync();}}addEventListener('blur',blur);document.addEventListener('visibilitychange',()=>{if(document.hidden)blur();});
function round(x,y,w,h,r,color){c.fillStyle=color;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}function circle(x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}function cloud(x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);circle(0,0,24,'#f8faf0');circle(29,-8,32,'#f8faf0');circle(62,3,21,'#f8faf0');round(-24,0,107,22,11,'#f8faf0');c.restore();}
function flag(x,y,active){c.strokeStyle='#476965';c.lineWidth=4;c.beginPath();c.moveTo(x,y);c.lineTo(x,y-70);c.stroke();c.fillStyle=active?'#dc9b61':'#f3dfbb';c.beginPath();c.moveTo(x,y-70);c.lineTo(x+37,y-57);c.lineTo(x,y-43);c.fill();}
function draw(t){c.fillStyle='#b6d8c8';c.fillRect(0,0,960,480);const cam=game.camera;circle(830-cam*.1,75,36,'#f8e5b0');cloud(120-cam*.18,80,.8);cloud(420-cam*.15,135,.55);cloud(710-cam*.12,65,.65);c.fillStyle='#91bea9';c.beginPath();c.moveTo(0,320);for(let i=0;i<7;i++)c.quadraticCurveTo(i*180+80-cam*.08,215,(i+1)*180-cam*.08,330);c.lineTo(960,480);c.lineTo(0,480);c.fill();c.save();c.translate(-cam,0);
for(const s of CloudTrail.solids){round(s.x,s.y,s.w,s.h,5,'#739c82');round(s.x,s.y,s.w,7,3,'#3f7563');for(let x=s.x+20;x<s.x+s.w;x+=40){c.strokeStyle='#a4b898';c.lineWidth=2;c.beginPath();c.moveTo(x,s.y+18);c.lineTo(x+8,s.y+18);c.stroke();}}c.fillStyle='#eef3de';c.font='13px system-ui';c.fillText('첫 발판',282,355);c.fillStyle='#395f56';c.fillText('틈을 넘어요',630,460);flag(735,420,game.checkpoint);flag(1540,420,true);
for(const coin of game.coins){if(coin.taken)continue;c.save();c.translate(coin.x,coin.y+Math.sin(t/300)*3);c.fillStyle='#ffe4a0';c.beginPath();for(let i=0;i<10;i++){let r=i%2?6:13,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.restore();}
let p=game.player;round(p.x-14,p.y-21,28,38,10,'#ec956d');round(p.x-16,p.y-20,32,8,5,'#fbf0d6');circle(p.x+p.face*7,p.y-6,2.7,'#38584e');round(p.x-13,p.y+15,10,7,3,'#3f7060');round(p.x+3,p.y+15,10,7,3,'#3f7060');c.restore();if(game.paused||game.phase==='won'){round(230,155,500,145,18,'#f4f1e8ed');c.textAlign='center';c.fillStyle='#315951';c.font='bold 29px system-ui';c.fillText(game.paused?'구름을 잠깐 바라보기':'깃발에 도착했어요!',480,205);c.font='15px system-ui';c.fillText(game.paused?'이어하기 버튼으로 계속':`별 ${game.coins.filter(x=>x.taken).length}개 · 다시 출발 ${game.deaths}번`,480,244);c.textAlign='left';}}
function frame(t){if(!last)last=t;acc+=Math.min(t-last,50)/1000;last=t;while(acc>=CloudTrail.DT){clock+=CloudTrail.DT;game.step({left:held.left||clock<until.left,right:held.right||clock<until.right});acc-=CloudTrail.DT;}sync();draw(t);requestAnimationFrame(frame);}sync();requestAnimationFrame(frame);

</script></body></html>
